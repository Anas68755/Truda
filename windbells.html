<!-- 10 Originals — Windbells Studio — original concept, 100% offline -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Windbells Studio — tune wind chimes with real physics, fully offline.">
<title>أجراس الريح — Windbells Studio</title>
<style>
/* ================================================================
   1. RESET + THEME TOKENS
   ================================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rad:14px; --tr:.25s cubic-bezier(.4,0,.2,1); --panelw:378px;
  --wood:#8a5a34; --wood2:#5f3c1f;
  --cu1:#c98d5e; --cu2:#8f5a33;
  --al1:#dfe4ea; --al2:#9aa4ae;
  --br1:#e0bd78; --br2:#9a7a3c;
}
body[data-theme="dusk"]{
  --bg1:#171425; --bg2:#292142; --glow:#372c56;
  --ink:#f3ead2; --dim:#bfb394; --gold:#e8d28a; --gold2:#f7e7b0; --goldink:#241c08;
  --panel:rgba(32,25,52,.94); --panel2:#261f3d; --line:#4a3d68;
  --btn:#332a4e; --btnink:#f3ead2; --glass:rgba(12,9,22,.5);
  --chipbg:rgba(232,210,138,.12); --danger:#f0a3a3; --ok:#a9d8b0; --shadow:0 14px 44px rgba(0,0,0,.45);
}
body[data-theme="night"]{
  --bg1:#080b12; --bg2:#0e1420; --glow:#131c2e;
  --ink:#e8eef7; --dim:#94a2ba; --gold:#e8d28a; --gold2:#f7e7b0; --goldink:#241c08;
  --panel:rgba(14,19,32,.95); --panel2:#101625; --line:#27334c;
  --btn:#182131; --btnink:#e8eef7; --glass:rgba(4,7,12,.55);
  --chipbg:rgba(232,210,138,.1); --danger:#f0a3a3; --ok:#a9d8b0; --shadow:0 14px 44px rgba(0,0,0,.6);
}
body[data-theme="paper"]{
  --bg1:#eee4cf; --bg2:#f8f1e0; --glow:#e3d5b6;
  --ink:#382d1a; --dim:#6d5d40; --gold:#8f6b1c; --gold2:#a9822c; --goldink:#fdf6e2;
  --panel:rgba(255,250,240,.95); --panel2:#fdf8ec; --line:#d3c39c;
  --btn:#f0e5cb; --btnink:#382d1a; --glass:rgba(255,250,238,.6);
  --chipbg:rgba(143,107,28,.12); --danger:#a33c3c; --ok:#3f7a4c; --shadow:0 10px 30px rgba(90,70,30,.25);
}
html{height:100%}
body{
  min-height:100dvh; display:flex; flex-direction:column;
  background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--ink);
  font:16px/1.55 "Segoe UI",Tahoma,system-ui,sans-serif;
  transition:background .4s;
}
/* ================================================================
   2. HEADER + CORNER CONTROLS
   ================================================================ */
header.top{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 18px 8px;
}
.brand h1{font-size:1.28rem; font-weight:700; color:var(--gold); letter-spacing:.3px}
.brand .sub{font-size:.8rem; color:var(--dim)}
nav.corner{display:flex; gap:8px; align-items:center}
.cbtn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--btn); color:var(--btnink); font-size:1.05rem; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
  transition:transform var(--tr), border-color var(--tr), background var(--tr);
}
.cbtn:hover{transform:translateY(-2px); border-color:var(--gold)}
.cbtn.lang{width:auto; border-radius:20px; padding-inline:14px; font-weight:700; font-size:.85rem}
/* ================================================================
   3. MAIN GRID — STAGE + PANEL
   ================================================================ */
main.wrap{
  flex:1; display:grid; grid-template-columns:minmax(0,1fr) var(--panelw);
  gap:14px; padding:0 14px 12px; min-height:0;
}
.stageBox{
  position:relative; border:1px solid var(--line); border-radius:var(--rad);
  overflow:hidden; min-height:430px; height:calc(100dvh - 158px);
  background:linear-gradient(180deg,var(--bg1),var(--glow)); box-shadow:var(--shadow);
}
canvas#stage{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer}
.hud{
  position:absolute; inset-block-start:10px; inset-inline-start:12px;
  display:flex; flex-direction:column; gap:7px; pointer-events:none; max-width:70%;
}
.windRow{
  display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--ink);
  background:var(--glass); padding:6px 10px; border-radius:12px; border:1px solid var(--line);
  backdrop-filter:blur(5px); width:max-content;
}
.meter{width:110px; height:8px; border-radius:6px; background:rgba(0,0,0,.35); border:1px solid var(--line); overflow:hidden}
.meter i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold2)); transition:width .2s linear}
#windPct{min-width:38px; text-align:end; font-variant-numeric:tabular-nums}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-size:.72rem; padding:3px 10px; border-radius:20px; border:1px solid var(--line);
  background:var(--chipbg); color:var(--ink); display:inline-flex; gap:5px; align-items:center;
}
.chip.rec{color:var(--danger); border-color:var(--danger); animation:pulse 1.1s infinite}
.chip.on{background:var(--gold); color:var(--goldink); border-color:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.transport{
  position:absolute; inset-inline:10px; inset-block-end:10px;
  display:flex; gap:8px; flex-wrap:wrap;
}
.tbtn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:12px;
  background:var(--btn); color:var(--btnink); border:1px solid var(--line); cursor:pointer;
  font:inherit; font-size:.85rem; transition:transform var(--tr), border-color var(--tr), background var(--tr);
}
.tbtn:hover{transform:translateY(-2px); border-color:var(--gold)}
.tbtn.on{background:var(--gold); color:var(--goldink); border-color:var(--gold)}
.tbtn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.tbtn.flashAnim{animation:flashK .9s ease-out}
@keyframes flashK{0%{box-shadow:0 0 0 0 var(--gold); background:var(--gold); color:var(--goldink)}100%{box-shadow:0 0 0 22px transparent}}
.tips{
  padding:6px 18px 8px; font-size:.84rem; color:var(--dim);
  display:flex; gap:8px; align-items:center; min-height:30px;
}
.tips b{color:var(--gold); font-weight:600; flex:none}
/* ================================================================
   4. SIDE PANEL + TABS
   ================================================================ */
aside.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--rad);
  display:flex; flex-direction:column; overflow:hidden; max-height:calc(100dvh - 120px);
  box-shadow:var(--shadow);
}
.tabs{display:flex; border-block-end:1px solid var(--line)}
button.tab{
  flex:1; padding:11px 4px; background:transparent; color:var(--dim); border:0; cursor:pointer;
  font:inherit; font-size:.9rem; border-block-end:2px solid transparent; transition:color var(--tr);
}
button.tab.on{color:var(--gold); border-block-end-color:var(--gold); background:rgba(255,255,255,.03)}
.tabBody{padding:12px 12px 16px; overflow-y:auto; flex:1; display:none; scrollbar-width:thin}
.tabBody.on{display:block}
.row{display:flex; align-items:center; gap:8px; margin-block-end:10px}
.row>label{min-width:82px; font-size:.84rem; color:var(--dim); flex:none}
.row select{
  flex:1; background:var(--btn); color:var(--btnink); border:1px solid var(--line);
  border-radius:9px; padding:7px 9px; font:inherit; font-size:.88rem; cursor:pointer;
}
.row b{font-variant-numeric:tabular-nums; min-width:52px; text-align:end; font-size:.84rem}
input[type="range"]{flex:1; accent-color:var(--gold); height:24px; cursor:pointer}
.note{
  font-size:.78rem; color:var(--dim); background:var(--chipbg); border:1px dashed var(--line);
  border-radius:9px; padding:6px 10px; margin-block-end:10px;
}
.sectHead{display:flex; align-items:center; gap:8px; margin-block:10px 8px}
.sectHead h3{font-size:.95rem; color:var(--gold); font-weight:700; flex:1}
.sectHead .cnt{font-size:.78rem; color:var(--dim)}
.sq{
  width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:var(--btn);
  color:var(--btnink); cursor:pointer; font-size:.95rem; display:inline-flex; align-items:center; justify-content:center;
  transition:border-color var(--tr), transform var(--tr); flex:none;
}
.sq:hover{border-color:var(--gold); transform:translateY(-1px)}
/* tube rows */
.tubeRow{
  border:1px solid var(--line); border-radius:11px; padding:8px 9px; margin-block-end:8px;
  background:rgba(255,255,255,.035); transition:border-color var(--tr), box-shadow var(--tr);
}
.tubeRow.sel{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold)}
.trTop{display:flex; align-items:center; gap:6px; margin-block-end:6px}
.tIdx{
  width:27px; height:27px; border-radius:50%; background:var(--gold); color:var(--goldink);
  font-weight:700; border:0; cursor:pointer; font-size:.85rem; flex:none;
}
.tDeg{
  background:var(--btn); color:var(--btnink); border:1px solid var(--line); border-radius:8px;
  padding:4px 6px; font:inherit; font-size:.82rem; cursor:pointer; max-width:104px;
}
.tNote{font-size:.76rem; color:var(--dim); margin-inline-start:auto; text-align:end; line-height:1.25; font-variant-numeric:tabular-nums}
.trSub{display:flex; align-items:center; gap:7px; font-size:.74rem; color:var(--dim); margin-block-start:3px}
.trSub label{min-width:30px}
.trSub b{min-width:104px; text-align:end; font-variant-numeric:tabular-nums; font-weight:400}
.presetsRow{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-block-start:6px}
.pbtn{
  padding:8px 6px; border-radius:10px; border:1px solid var(--line); background:var(--btn);
  color:var(--btnink); font:inherit; font-size:.82rem; cursor:pointer; transition:border-color var(--tr), transform var(--tr);
}
.pbtn:hover{border-color:var(--gold); transform:translateY(-1px)}
.bigBtn{
  width:100%; padding:12px; border-radius:12px; border:1px solid var(--gold);
  background:var(--gold); color:var(--goldink); font:inherit; font-weight:700; font-size:.95rem;
  cursor:pointer; transition:transform var(--tr), filter var(--tr); margin-block:4px;
}
.bigBtn:hover{transform:translateY(-2px); filter:brightness(1.06)}
.bigBtn.stop{background:var(--btn); color:var(--btnink); border-color:var(--danger)}
.subBox{border:1px solid var(--line); border-radius:11px; padding:10px; margin-block-end:12px; background:rgba(255,255,255,.03)}
.subBox h4{font-size:.87rem; color:var(--gold); margin-block-end:8px}
.subBox p{font-size:.8rem; color:var(--dim); margin-block-end:8px}
.mono{font-variant-numeric:tabular-nums; font-size:.85rem; color:var(--dim)}
/* ================================================================
   5. LIBRARY
   ================================================================ */
.libItem{
  display:flex; gap:9px; align-items:center; border:1px solid var(--line); border-radius:11px;
  padding:8px; margin-block-end:8px; background:rgba(255,255,255,.035);
}
.libItem canvas{border-radius:7px; background:rgba(0,0,0,.28); flex:none; border:1px solid var(--line)}
.libMeta{flex:1; min-width:0}
.libName{font-weight:600; font-size:.89rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.libSub{font-size:.73rem; color:var(--dim); font-variant-numeric:tabular-nums}
.hint{font-size:.79rem; color:var(--dim); margin-block-end:8px}
.empty{font-size:.82rem; color:var(--dim); text-align:center; padding:12px 0; opacity:.8}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-block-start:12px}
.stat{
  border:1px solid var(--line); border-radius:10px; padding:7px 4px; text-align:center; font-size:.7rem; color:var(--dim);
}
.stat b{display:block; font-size:1.02rem; color:var(--gold); font-variant-numeric:tabular-nums}
/* ================================================================
   6. OVERLAYS + MODALS
   ================================================================ */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center;
  justify-content:center; z-index:60; padding:16px; animation:fadeIn .22s ease-out;
}
.overlay[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel2); border:1px solid var(--line); border-radius:18px; width:min(580px,100%);
  max-height:88dvh; overflow-y:auto; padding:20px 22px; box-shadow:0 22px 70px rgba(0,0,0,.55);
  animation:popIn .24s cubic-bezier(.34,1.4,.64,1);
}
@keyframes popIn{from{transform:translateY(14px) scale(.97); opacity:0}to{transform:none; opacity:1}}
.modal h2{font-size:1.12rem; color:var(--gold); margin-block-end:12px}
.modal h3{font-size:.95rem; color:var(--gold); margin-block:12px 6px}
.modal p{font-size:.9rem; margin-block-end:9px; color:var(--ink)}
.modal p.dim{color:var(--dim)}
.modal ul{margin:0 0 9px; padding-inline-start:20px; font-size:.88rem; color:var(--ink)}
.modal li{margin-block-end:4px}
.mbtnrow{display:flex; gap:9px; justify-content:flex-end; margin-block-start:16px; flex-wrap:wrap}
.primary{
  background:var(--gold); color:var(--goldink); border:0; border-radius:11px; padding:10px 18px;
  font:inherit; font-weight:700; cursor:pointer; transition:filter var(--tr), transform var(--tr);
}
.primary:hover{filter:brightness(1.07); transform:translateY(-1px)}
.ghost{
  background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:11px;
  padding:10px 15px; cursor:pointer; font:inherit; transition:border-color var(--tr);
}
.ghost:hover{border-color:var(--gold)}
.dangerT{color:var(--danger)}
.formula{
  direction:ltr; text-align:center; font-family:Cambria,Georgia,serif; font-size:1.02rem;
  background:var(--chipbg); border:1px solid var(--line); border-radius:10px; padding:9px; margin-block:8px;
}
.onboardSvg{display:block; margin:8px auto 4px}
svgCap{text-align:center}
.pCap{display:block; text-align:center; font-size:.78rem; color:var(--dim); margin-block-end:8px}
textarea.fbTa{
  width:100%; height:190px; direction:ltr; text-align:left; font-family:Consolas,Menlo,monospace;
  font-size:.78rem; background:rgba(0,0,0,.3); color:var(--ink); border:1px solid var(--line);
  border-radius:10px; padding:9px; resize:vertical;
}
.kTable{width:100%; border-collapse:collapse; font-size:.86rem}
.kTable td{padding:6px 8px; border-block-end:1px solid var(--line)}
.kTable td:first-child{width:120px}
kbd{
  background:var(--btn); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px;
  padding:2px 8px; font-family:Consolas,Menlo,monospace; font-size:.8rem; color:var(--gold);
}
input.nmInp{
  width:100%; background:var(--btn); color:var(--btnink); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; font:inherit; font-size:.92rem; margin-block:8px;
}
/* ================================================================
   7. TOASTS
   ================================================================ */
#toasts{
  position:fixed; inset-block-end:20px; inset-inline:0; display:flex; flex-direction:column;
  align-items:center; gap:8px; z-index:90; pointer-events:none;
}
.toast{
  background:var(--gold); color:var(--goldink); padding:10px 20px; border-radius:26px;
  font-size:.9rem; font-weight:600; box-shadow:0 8px 28px rgba(0,0,0,.45);
  animation:toastIn .3s cubic-bezier(.34,1.4,.64,1); max-width:88vw; text-align:center;
}
.toast.warn{background:var(--danger); color:#221010}
.toast.out{opacity:0; transform:translateY(8px); transition:all .35s}
@keyframes toastIn{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
/* ================================================================
   8. ACCESSIBILITY + MOTION + PRINT
   ================================================================ */
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px}
::selection{background:var(--gold); color:var(--goldink)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
#printArea{display:none}
@media print{
  body>*{display:none !important}
  #printArea{display:block !important}
  #printArea canvas{width:100%; height:auto}
}
@media (max-width:940px){
  main.wrap{grid-template-columns:1fr}
  .stageBox{height:52dvh; min-height:340px}
  aside.panel{max-height:none}
  .brand .sub{display:none}
  body{font-size:15px}
}
</style>
</head>
<body data-theme="dusk">

<!-- ==================== HEADER ==================== -->
<header class="top">
  <div class="brand">
    <h1 data-i18n="title">أجراس الريح</h1>
    <span class="sub" data-i18n="subtitle"></span>
  </div>
  <nav class="corner" aria-label="corner controls">
    <a class="cbtn" id="backLink" href="../index.html" data-i18n-aria="backA" title="↩">↩</a>
    <button class="cbtn lang" id="langBtn" data-i18n-aria="langA">EN</button>
    <button class="cbtn" id="aboutBtn" data-i18n-aria="aboutA">ⓘ</button>
    <button class="cbtn" id="settingsBtn" data-i18n-aria="settingsA">⚙</button>
  </nav>
</header>

<!-- ==================== MAIN ==================== -->
<main class="wrap">
  <section class="stageCol">
    <div class="stageBox">
      <canvas id="stage" role="img"></canvas>
      <div class="hud">
        <div class="windRow"><span data-i18n="windLabel"></span><div class="meter"><i id="windFill"></i></div><b id="windPct">0%</b></div>
        <div class="chips" id="modeChips"></div>
      </div>
      <div class="transport">
        <button class="tbtn" id="btnWind">🍃 <span data-i18n="letWind"></span></button>
        <button class="tbtn" id="btnRec">⏺ <span data-i18n="rec60"></span></button>
        <button class="tbtn" id="btnPng">📐 <span data-i18n="expPng"></span></button>
        <button class="tbtn" id="btnPrint">🖨 <span data-i18n="expPrint"></span></button>
      </div>
    </div>
    <div class="tips"><b data-i18n="tipLabel"></b><span id="tipTxt"></span></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="build" role="tab" data-i18n="tabBuild"></button>
      <button class="tab" data-tab="wind" role="tab" data-i18n="tabWind"></button>
      <button class="tab" data-tab="lib" role="tab" data-i18n="tabLib"></button>
    </div>

    <!-- BUILD TAB -->
    <section class="tabBody on" id="tab-build" role="tabpanel">
      <div class="row"><label for="metalSel" data-i18n="metal"></label>
        <select id="metalSel">
          <option value="copper"></option><option value="aluminum"></option><option value="brass"></option>
        </select></div>
      <div class="row"><label for="scaleSel" data-i18n="scale"></label><select id="scaleSel"></select></div>
      <div class="row"><label for="rootSel" data-i18n="root"></label><select id="rootSel"></select></div>
      <div class="note" id="soundInfo"></div>
      <div class="sectHead">
        <h3 data-i18n="tubesTitle"></h3><span class="cnt" id="tubeCount"></span>
        <button class="sq" id="addTube" data-i18n-aria="addTubeA" title="＋">＋</button>
        <button class="sq" id="delTube" data-i18n-aria="delTubeA" title="－">－</button>
      </div>
      <div id="tubeList"></div>
      <div class="sectHead"><h3 data-i18n="presetsTitle"></h3></div>
      <div class="presetsRow">
        <button class="pbtn" data-preset="meditation"></button>
        <button class="pbtn" data-preset="rain"></button>
        <button class="pbtn" data-preset="desert"></button>
        <button class="pbtn" data-preset="harbor"></button>
      </div>
    </section>

    <!-- WIND TAB -->
    <section class="tabBody" id="tab-wind" role="tabpanel">
      <div class="row"><label for="windR" data-i18n="windStrength"></label>
        <input type="range" id="windR" min="0" max="100" step="1" value="55"><b id="windV">55%</b></div>
      <div class="row" id="wpChips">
        <button class="pbtn" data-wp="breeze" style="flex:1"></button>
        <button class="pbtn" data-wp="steady" style="flex:1"></button>
        <button class="pbtn" data-wp="gale" style="flex:1"></button>
      </div>
      <button class="bigBtn" id="btnWindTab">🍃 <span data-i18n="letWind"></span></button>
      <div class="subBox">
        <h4>⏺ <span data-i18n="recTitle"></span></h4>
        <p data-i18n="recHint"></p>
        <button class="pbtn" id="btnRecTab" style="width:100%">⏺ <span data-i18n="rec60"></span></button>
        <div class="mono" id="recTimer" style="text-align:center;margin-block-start:6px"></div>
      </div>
      <div class="subBox">
        <h4>🎻 <span data-i18n="duetTitle"></span></h4>
        <p data-i18n="duetHint"></p>
        <div class="row"><label>A</label><select id="duetA"></select></div>
        <div class="row"><label>B</label><select id="duetB"></select></div>
        <button class="pbtn" id="btnDuetTab" style="width:100%">🎻 <span data-i18n="duetStart"></span></button>
      </div>
      <div class="subBox">
        <h4>🌅 <span data-i18n="concertTitle"></span></h4>
        <p data-i18n="concertDesc"></p>
        <button class="pbtn" id="btnConcert" style="width:100%">🌅 <span data-i18n="concertStart"></span></button>
        <div class="mono" id="concertT" style="text-align:center;margin-block-start:6px"></div>
      </div>
    </section>

    <!-- LIBRARY TAB -->
    <section class="tabBody" id="tab-lib" role="tabpanel">
      <div class="sectHead">
        <h3 data-i18n="designsTitle"></h3>

    const [t1,v1]=CONCERT[i],[t2,v2]=CONCERT[i+1];
    if(e>=t1&&e<t2)return lerp(v1,v2,(e-t1)/(t2-t1));
  }
  return 0;
}

/* ================================================================
   B4. STAGE RENDERER (canvas, to-scale, theme-aware)
   ================================================================ */
const stageCv=$('#stage');
let CV={},dpr=1;
function readTheme(){
  const cs=getComputedStyle(document.body);
  CV={ink:cs.getPropertyValue('--ink').trim(),dim:cs.getPropertyValue('--dim').trim(),
      gold:cs.getPropertyValue('--gold').trim(),line:cs.getPropertyValue('--line').trim(),
      bg1:cs.getPropertyValue('--bg1').trim(),glow:cs.getPropertyValue('--glow').trim()};
}
const METAL_C={copper:['#c98d5e','#8f5a33'],aluminum:['#e3e8ee','#98a2ad'],brass:['#e0bd78','#9a7a3c']};
function geom(W,H){
  const n=design.tubes.length;
  const mL=Math.max(1,...design.tubes.map(x=>x.len));
  const span=Math.min(W*.74,760);
  const x0=W/2-span/2,x1=W/2+span/2;
  const pxCm=(H*.58)/mL;
  return {n,span,x0,x1,pxCm,aY:H*.15,ax:i=>n>1?x0+(x1-x0)*(i/(n-1)):W/2};
}
function draw(){
  const ctx=stageCv.getContext('2d');
  const r=stageCv.getBoundingClientRect();
  if(!r.width||!r.height)return;
  if(r.width*dpr!==stageCv.width||r.height*dpr!==stageCv.height){
    dpr=Math.min(2,window.devicePixelRatio||1);
    stageCv.width=Math.round(r.width*dpr); stageCv.height=Math.round(r.height*dpr);
  }
  const W=stageCv.width/dpr,H=stageCv.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* sky */
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,CV.bg1); g.addColorStop(1,CV.glow);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const G=geom(W,H);
  /* wind streaks */
  if(Sim.streaks.length){
    const s=Sim.level();
    ctx.save();
    ctx.strokeStyle=CV.gold; ctx.lineCap='round';
    Sim.streaks.forEach(p=>{
      ctx.globalAlpha=.05+.1*s*p.a;
      ctx.lineWidth=1.4;
      ctx.beginPath();
      const y=p.y*H*.86;
      ctx.moveTo(p.x*W,y);
      ctx.lineTo(p.x*W+18+40*s,y-3);
      ctx.stroke();
    });
    ctx.restore();
  }
  /* wooden top bar */
  const bw=G.span+64, bx=W/2-bw/2, by=G.aY-15;
  const wg=ctx.createLinearGradient(0,by,0,by+28);
  wg.addColorStop(0,'#a06c40'); wg.addColorStop(1,'#5f3c1f');
  ctx.fillStyle=wg; rr(ctx,bx,by,bw,28,12); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.18)';
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.moveTo(bx+14,by+7+i*5);
    ctx.quadraticCurveTo(bx+bw/2,by+5+i*5+Math.sin(i*2.4)*3,bx+bw-14,by+7+i*5); ctx.stroke();
  }
  /* cords + tubes */
  for(let i=0;i<G.n;i++){
    const tb=design.tubes[i];
    const axp=G.ax(i);
    const cordPx=clamp(H*.045+tb.len*G.pxCm*.1,26,86);
    const tx=axp+Math.sin(tb.ph.th)*cordPx, ty=G.aY+Math.cos(tb.ph.th)*cordPx;
    ctx.strokeStyle='rgba(190,175,140,.6)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(axp,G.aY+13); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.fillStyle='rgba(190,175,140,.8)';
    ctx.beginPath(); ctx.arc(axp,G.aY+13,2.4,0,7); ctx.fill();
    const L=tb.len*G.pxCm, tw=clamp(5+G.pxCm*1.9,7,26);
    const [c1,c2]=METAL_C[design.metal]||METAL_C.brass;
    ctx.save();
    ctx.translate(tx,ty); ctx.rotate(tb.ph.th);
    const tg=ctx.createLinearGradient(-tw/2,0,tw/2,0);
    tg.addColorStop(0,c2); tg.addColorStop(.35,c1); tg.addColorStop(1,c2);
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=6; ctx.shadowOffsetY=3;
    ctx.fillStyle=tg; rr(ctx,-tw/2,0,tw,L,tw/2); ctx.fill();
    ctx.shadowColor='transparent';
    ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1; ctx.stroke();
    /* mouth ellipse + cap shading */
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0,2,tw/2*.72,2.6,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.22)';
    rr(ctx,-tw/2,L-tw*1.1,tw,tw*1.1,tw/2); ctx.fill();
    /* two hang holes measured from top */
    const h1=Math.max(4,L*.05), h2=h1+Math.max(3.5,L*.05);
    ctx.fillStyle='rgba(20,12,4,.8)';
    ctx.beginPath(); ctx.arc(0,h1,tw*.14,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(0,h2,tw*.14,0,7); ctx.fill();
    /* strike flash */
    if(tb.fl>.02){
      ctx.shadowColor=CV.gold; ctx.shadowBlur=22*tb.fl;
      ctx.fillStyle=`rgba(247,231,176,${(.45*tb.fl).toFixed(3)})`;
      rr(ctx,-tw/2,0,tw,L,tw/2); ctx.fill();
      ctx.shadowColor='transparent';
    }
    if(i===hover&&i!==sel){ctx.strokeStyle=CV.dim;ctx.lineWidth=1.5;rr(ctx,-tw/2-2,-2,tw+4,L+4,tw/2+2);ctx.stroke()}
    if(i===sel){ctx.strokeStyle=CV.gold;ctx.lineWidth=2;rr(ctx,-tw/2-3,-3,tw+6,L+6,tw/2+3);ctx.stroke()}
    if(i===sel||i===hover){
      const f=freqOf(tb), ni=noteInfo(f);
      ctx.fillStyle=CV.ink; ctx.font='11px Tahoma, sans-serif';
      ctx.textAlign=dir==='rtl'?'right':'left';
      ctx.fillText(`${ni.name} · ${fmt1(tb.len)} cm`,(dir==='rtl'?-1:1)*(tw/2+6),Math.min(L*.5,H*.7));
    }
    ctx.restore();
  }
  /* wooden clapper disc swinging in the middle */
  const clx=W/2+Math.sin(Sim.clap.th)*H*.11, cly=G.aY+Math.cos(Sim.clap.th)*H*.17+18;
  ctx.strokeStyle='rgba(190,175,140,.55)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(W/2,G.aY+13); ctx.lineTo(clx,cly); ctx.stroke();
  const cr=clamp(11+G.pxCm*.55,11,22);
  const cg=ctx.createRadialGradient(clx-cr*.3,cly-cr*.3,2,clx,cly,cr);
  cg.addColorStop(0,'#a06c40'); cg.addColorStop(1,'#4e3018');
  ctx.fillStyle=cg;
  ctx.beginPath(); ctx.arc(clx,cly,cr,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke();
  ctx.strokeStyle='rgba(247,231,176,.35)';
  ctx.beginPath(); ctx.arc(clx,cly,cr*.55,0,7); ctx.stroke();
  /* quiet vignette */
  const vg=ctx.createRadialGradient(W/2,H*.42,H*.3,W/2,H*.42,H*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.28)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}
/* pointer picking: inverse-rotate into each tube's local frame */
function pickTube(e){
  const r=stageCv.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const W=r.width,H=r.height, G=geom(W,H);
  for(let i=G.n-1;i>=0;i--){
    const tb=design.tubes[i], axp=G.ax(i);
    const cordPx=clamp(H*.045+tb.len*G.pxCm*.1,26,86);
    const tx=axp+Math.sin(tb.ph.th)*cordPx, ty=G.aY+Math.cos(tb.ph.th)*cordPx;
    const dx=px-tx, dy=py-ty;
    const lx=dx*Math.cos(-tb.ph.th)-dy*Math.sin(-tb.ph.th);
    const ly=dx*Math.sin(-tb.ph.th)+dy*Math.cos(-tb.ph.th);
    const tw=clamp(5+G.pxCm*1.9,7,26), L=tb.len*G.pxCm;
    if(Math.abs(lx)<tw/2+7&&ly>-6&&ly<L+8)return i;
  }
  return -1;
}

function renderMini(cv,d){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  c.clearRect(0,0,W,H);
  const mL=Math.max(...d.tubes.map(x=>x.len));
  const n=d.tubes.length;
  const [c1,c2]=METAL_C[d.metal]||METAL_C.brass;
  d.tubes.forEach((tb,i)=>{
    const x=W*(i+0.5)/n;
    const L=(tb.len/mL)*(H-8);
    const g=c.createLinearGradient(x-3,0,x+3,0);
    g.addColorStop(0,c2);g.addColorStop(.5,c1);g.addColorStop(1,c2);
    c.fillStyle=g;
    c.fillRect(x-3,H-L-4,6,L);
  });
  c.strokeStyle='rgba(160,108,64,.9)'; c.lineWidth=2;
  c.beginPath(); c.moveTo(3,3); c.lineTo(W-3,3); c.stroke();
}
function renderStats(){

function holeMms(L){const a=clamp(Math.round(L*4),10,30);return[a,a+10]}
function renderBlueprint(cv,d){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  c.fillStyle='#f7f2e2'; c.fillRect(0,0,W,H);
  c.strokeStyle='#2a241a'; c.lineWidth=3; c.strokeRect(18,18,W-36,H-36);
  c.lineWidth=1; c.strokeRect(26,26,W-52,H-52);
  /* header */
  c.fillStyle='#2a241a'; c.textBaseline='alphabetic';
  c.font='bold 30px "Segoe UI",Tahoma,sans-serif'; c.textAlign='left'; c.direction='ltr';
  c.fillText('Windbells Studio',48,74);
  c.font='16px Tahoma,sans-serif'; c.fillText('أجراس الريح — مخطط بناء / Build Blueprint',48,100);
  c.textAlign='right';
  c.font='bold 20px "Segoe UI",Tahoma,sans-serif';
  c.fillText(d.name,W-48,74);
  c.font='13px Tahoma,sans-serif';
  const dt=new Date();
  const rootLbl=noteInfo(midiFreq(d.root)).name;
  c.fillText(`Scale: ${t(SCALES[d.scale].name)} · Root: ${rootLbl} · Metal: ${t(d.metal)} · Temp: ${settings.temp}°C · v = ${fmt1(airV(settings.temp))} m/s`,W-48,98);
  c.fillText(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,W-48,120);
  /* cut list, to scale */
  const top=170, bottom=H-260;
  const mL=Math.max(...d.tubes.map(x=>x.len));
  const pxCm=(bottom-top)/mL;
  const n=d.tubes.length;
  const colW=(W-96)/n;
  const [c1,c2]=METAL_C[d.metal]||METAL_C.brass;
  c.textAlign='left';
  c.font='bold 15px "Segoe UI",Tahoma,sans-serif';
  c.fillText('Cut list (to scale) · قائمة القص بمقياس رسم',48,152);
  d.tubes.forEach((tb,i)=>{
    const cx=48+colW*i+colW/2;
    const L=tb.len*pxCm, tw=Math.min(34,colW*.42);
    const x=cx-tw/2, y0=top;
    const g=c.createLinearGradient(x,0,x+tw,0);
    g.addColorStop(0,c2);g.addColorStop(.4,c1);g.addColorStop(1,c2);
    c.fillStyle=g; rr(c,x,y0,tw,L,tw/2); c.fill();
    c.strokeStyle='#2a241a'; c.lineWidth=1.2; c.stroke();
    /* hang holes with crosshairs */
    const hm=holeMms(tb.len);
    [[hm[0],'A'],[hm[1],'B']].forEach(([mm,lbl])=>{
      const hy=y0+mm/10*pxCm;
      c.fillStyle='#f7f2e2'; c.beginPath(); c.arc(cx,hy,tw*.16,0,7); c.fill();
      c.strokeStyle='#2a241a'; c.beginPath(); c.arc(cx,hy,tw*.16,0,7); c.stroke();
      c.beginPath(); c.moveTo(cx-6,hy); c.lineTo(cx+6,hy); c.moveTo(cx,hy-6); c.lineTo(cx,hy+6); c.stroke();
      if(i===0){
        c.font='11px Tahoma,sans-serif'; c.textAlign='left';
        c.fillText(`${lbl} ${mm}mm`,cx+tw/2+6,hy+4);
      }
    });
    /* dimension line + labels */
    const ni=noteInfo(freqOf(tb));
    c.fillStyle='#2a241a'; c.textAlign='center';
    c.font='bold 13px "Segoe UI",Tahoma,sans-serif';
    c.fillText(`#${i+1} · ${ni.name}`,cx,y0+L+22);
    c.font='12px Tahoma,sans-serif';
    c.fillText(`${fmt1(tb.len)} cm / ${fmt1(cm2in(tb.len))}″`,cx,y0+L+40);
    c.fillText(`${fmt1(freqOf(tb))} Hz${tb.det?` (${tb.det>0?'+':''}${tb.det}¢)`:''}`,cx,y0+L+58);
    /* vertical dimension arrow */
    c.strokeStyle='#2a241a';
    c.beginPath(); c.moveTo(x-10,y0); c.lineTo(x-10,y0+L); c.stroke();
    c.beginPath(); c.moveTo(x-14,y0+6); c.lineTo(x-10,y0); c.lineTo(x-6,y0+6); c.stroke();
    c.beginPath(); c.moveTo(x-14,y0+L-6); c.lineTo(x-10,y0+L); c.lineTo(x-6,y0+L-6); c.stroke();
    c.font='10px Tahoma,sans-serif';
    c.save(); c.translate(x-16,y0+L/2); c.rotate(-Math.PI/2); c.fillText(`${fmt1(tb.len)} cm`,0,-4); c.restore();
  });
  /* scale ruler */
  const ry=H-236;
  c.strokeStyle='#2a241a'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(48,ry); c.lineTo(48+10*pxCm,ry); c.stroke();
  c.beginPath(); c.moveTo(48,ry-5); c.lineTo(48,ry+5); c.moveTo(48+10*pxCm,ry-5); c.lineTo(48+10*pxCm,ry+5); c.stroke();
  c.fillStyle='#2a241a'; c.font='11px Tahoma,sans-serif'; c.textAlign='left';
  c.fillText(`10 cm`,48+10*pxCm+8,ry+4);
  /* cord tie diagram */
  const tx=48, ty=H-216, tw2=330, th2=140;
  c.strokeRect(tx,ty,tw2,th2);
  c.font='bold 13px "Segoe UI",Tahoma,sans-serif';
  c.fillText('Cord tie diagram · مخطط ربط السلك',tx+12,ty+22);
  /* schematic: tube top + cord path */
  const sx=tx+70, sy=ty+40;
  c.fillStyle='#d9c9a4'; rr(c,sx-26,sy,52,86,12); c.fill(); c.strokeStyle='#2a241a'; c.stroke();
  [[34],[58]].forEach(([dy])=>{
    c.fillStyle='#f7f2e2'; c.beginPath(); c.arc(sx,sy+dy,5,0,7); c.fill();
    c.strokeStyle='#2a241a'; c.beginPath(); c.arc(sx,sy+dy,5,0,7); c.stroke();
  });
  c.strokeStyle='#7a5a2a'; c.lineWidth=2.4;
  c.beginPath(); c.moveTo(sx-26,sy+34); c.lineTo(sx-5,sy+34);
  c.quadraticCurveTo(sx+8,sy+34,sx+5,sy+46);
  c.quadraticCurveTo(sx+2,sy+58,sx+5,sy+58);
  c.lineTo(sx-26,sy+58); c.stroke();
  c.beginPath(); c.moveTo(sx-40,sy+46); c.quadraticCurveTo(sx-33,sy+40,sx-26,sy+34); c.stroke();
  c.beginPath(); c.moveTo(sx-40,sy+46); c.quadraticCurveTo(sx-33,sy+52,sx-26,sy+58); c.stroke();
  c.beginPath(); c.arc(sx-46,sy+46,7,0,7); c.stroke();
  c.fillStyle='#2a241a'; c.font='11px Tahoma,sans-serif'; c.textAlign='left';
  const tsteps=[t('bpTie1'),t('bpTie2'),t('bpTie3')];
  tsteps.forEach((s,k)=>c.fillText(`${k+1}. ${s}`,tx+150,ty+52+k*28));
  /* title block */
  const bx=W-48-400, by=H-216;
  c.strokeRect(bx,by,400,140);
  const rows=[
    [t('bpScale'),t(SCALES[d.scale].name)],
    [t('bpRoot'),`${rootLbl} (${fmt1(midiFreq(d.root))} Hz)`],
    [t('bpMetal'),t(d.metal)],
    [t('bpTubes'),String(n)],
    [t('bpTemp'),`${settings.temp}°C · v = ${fmt1(airV(settings.temp))} m/s`],
  ];
  c.font='12px "Segoe UI",Tahoma,sans-serif';
  rows.forEach(([k,v],i2)=>{
    const y=by+22+i2*23;
    c.textAlign='left'; c.fillStyle='#6b5c42'; c.fillText(k,bx+12,y);
    c.textAlign='right'; c.fillStyle='#2a241a'; c.fillText(v,bx+388,y);
    c.strokeStyle='rgba(42,36,26,.25)'; c.beginPath(); c.moveTo(bx+8,y+8); c.lineTo(bx+392,y+8); c.stroke();
  });
  /* formula + footer */
  c.textAlign='center'; c.fillStyle='#2a241a';
  c.font='13px Cambria,Georgia,serif';
  c.fillText('f = v / ( 2·( L + 0.6·d ) )   ·   d = 1.6 cm   ·   v = 331.3 + 0.6·T',W/2,H-52);
  c.font='11px Tahoma,sans-serif'; c.fillStyle='#6b5c42';
  c.fillText(t('bpFoot'),W/2,H-32);
}

  $$('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $$('.tabBody').forEach(x=>x.classList.toggle('on',x.id==='tab-'+b.dataset.tab));
}));
/* ================================================================
   C8. STAGE INPUT (pointer + keyboard) + MAIN LOOP
   ================================================================ */
let drag=null;
stageCv.addEventListener('pointerdown',e=>{
  AE.ensure();
  const i=pickTube(e);
  if(i<0)return;
  sel=i; syncSelRows();
  drag={i,y:e.clientY,l0:design.tubes[i].len,moved:false};
  try{stageCv.setPointerCapture(e.pointerId)}catch(err){}
});
stageCv.addEventListener('pointermove',e=>{
  if(drag){
    const dy=e.clientY-drag.y;
    if(Math.abs(dy)>5)drag.moved=true;
    if(drag.moved){
      const r=stageCv.getBoundingClientRect();
      const G=geom(r.width,r.height);
      const tb=design.tubes[drag.i];
      tb.len=clamp(Math.round((drag.l0+dy/G.pxCm)*10)/10,9,170);
      tb.deg=nearestDeg(tb.len,tb);
      updateTubeRow(drag.i); persistSoon();
    }
  }else{
    hover=pickTube(e);
    stageCv.style.cursor=hover>=0?'grab':'default';
  }
});
function endDrag(e){
  if(!drag)return;
  if(!drag.moved)manualStrike(drag.i,.85);
  else persistSoon();
  drag=null;
}
stageCv.addEventListener('pointerup',endDrag);
stageCv.addEventListener('pointercancel',()=>{drag=null});
stageCv.addEventListener('pointerleave',()=>{hover=-1;drag=null});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeTop();return}
  if(anyOvl())return;
  const tg=e.target.tagName;
  if(/INPUT|SELECT|TEXTAREA/.test(tg))return;
  if(e.key>='1'&&e.key<='8'){
    const i=+e.key-1;
    if(i<design.tubes.length){sel=i;syncSelRows();manualStrike(i,.85)}
    return;
  }
  switch(e.key){
    case 'ArrowUp': case 'ArrowDown':{
      e.preventDefault();
      const tb=design.tubes[sel]; if(!tb)return;
      const step=e.shiftKey?2:.5;
      tb.len=clamp(Math.round((tb.len+(e.key==='ArrowUp'?-step:step))*10)/10,9,170);
      tb.deg=nearestDeg(tb.len,tb);
      updateTubeRow(sel); persistSoon();
      break;
    }
    case 'ArrowRight': sel=(sel+1)%design.tubes.length; syncSelRows(); break;
    case 'ArrowLeft': sel=(sel-1+design.tubes.length)%design.tubes.length; syncSelRows(); break;
    case 'w': case 'W': toggleWind(); break;
    case 'r': case 'R': toggleRecord(); break;
    case 'e': case 'E': exportPNG(); break;
    case 'h': case 'H': renderKeysTable(); openOvl($('#ovlKeys')); break;
  }
});
let lastT=0,hudT=0,statTick=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(document.hidden)return;
  const dt=clamp(((ts-lastT)||16)/1000,.001,.05);
  lastT=ts;
  Sim.step(dt);
  draw();
  hudT+=dt;
  if(hudT>.25){
    hudT=0;
    const cur=Sim.level();
    $('#windFill').style.width=`${Math.round(clamp(cur,0,1)*100)}%`;
    $('#windPct').textContent=`${Math.round(clamp(cur,0,1)*100)}%`;
    if(windOn||concertOn){stats.secs+=.25;saveStatsSoon()}
    statTick+=.25;
    if(statTick>2){statTick=0;renderStats()}
    if(duetOn&&Sim.t-phraseT>8)duetPhrase();
    if(recording&&$('#chipRecT'))$('#chipRecT').textContent=`${t('chipRec')} ${fmt1(60-(AE.ctx.currentTime-recording.t0))}s`;
  }
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    lastT=0;
    if(AE.ctx&&AE.ctx.state==='suspended')AE.ctx.resume();
  }
});
/* ================================================================
   C9. INIT
   ================================================================ */
function init(){
  lang=store.get('bells_lang','ar'); if(lang!=='ar'&&lang!=='en')lang='ar';
  Object.assign(settings,store.get('bells_settings',{})||{});
  settings.vol=clamp(+settings.vol||80,0,100);
  settings.reverb=clamp(+settings.reverb||35,0,100);
  settings.temp=clamp(+settings.temp||20,0,40);
  if(!['dusk','night','paper'].includes(settings.theme))settings.theme='dusk';
  if(!['breeze','steady','gale'].includes(settings.windPreset))settings.windPreset='steady';
  windLevel={breeze:30,steady:55,gale:85}[settings.windPreset];
  const saved=store.get('bells_design',null);
  design=saved&&saved.tubes&&saved.tubes.length?hydrate(saved):defaultDesign();
  if(!design.name)design.name=lang==='ar'?'تصميمي':'My design';
  lib=store.get('bells_lib',[])||[];
  scores=store.get('bells_scores',[])||[];
  stats=Object.assign({strikes:0,recs:0,exports:0,secs:0},store.get('bells_stats',{})||{});
  sel=clamp(sel,0,design.tubes.length-1);
  applyTheme();
  applyLang();
  syncSettingsUI();
  updateChips();
  refreshWindUI();
  if(!store.get('bells_seen',false))openOvl($('#ovlOnboard'));
  tipIv=setInterval(()=>rotateTip(false),12000);
  requestAnimationFrame(loop);
  /* lazy audio unlock on any first gesture */
  window.addEventListener('pointerdown',function unlock(){AE.ensure();window.removeEventListener('pointerdown',unlock)});
}
init();
</script>
