<!-- 10 Originals — ʿAbq: The Scent Ledger — original concept, 100% offline -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>عَبق: دفتر العطور — ʿAbq: The Scent Ledger</title>
<style>
/* ============ THEME TOKENS — night apothecary (default), ivory, rose ============ */
:root{
  --bg:#251425; --bg2:#1c0e1d; --panel:#331e33; --panel2:#3e2441; --line:#50304e; --line2:#5d3a5a;
  --ink:#f6eaf2; --ink-dim:#cfb2c4; --faint:#a98ba2;
  --accent:#d98cb3; --accent-deep:#b05f8f; --accent-ink:#2b0f22;
  --gold:#e8c26a; --good:#95d8a8; --bad:#e79a9a;
  --canvas:#efe3d0; --canvas-ink:#7a6a58;
  --shadow:0 12px 34px rgba(10,3,10,.5); --r:14px; --rs:9px;
}
body[data-theme="ivory"]{
  --bg:#f2e9d8; --bg2:#e9dec7; --panel:#faf4e6; --panel2:#f0e6d0; --line:#d8c6a8; --line2:#c4b090;
  --ink:#38202e; --ink-dim:#6a4f60; --faint:#8d6f80;
  --accent:#93356f; --accent-deep:#772a5a; --accent-ink:#fff3f8;
  --gold:#7c5e14; --good:#2c7b4d; --bad:#a53c3c;
  --canvas:#fdf9f0; --canvas-ink:#8a7a66;
  --shadow:0 10px 26px rgba(96,66,30,.16);
}
body[data-theme="rose"]{
  --bg:#3b1e2b; --bg2:#2f1622; --panel:#4a2738; --panel2:#583045; --line:#6a3b52; --line2:#7c4660;
  --ink:#fdeaf3; --ink-dim:#dcb2c8; --faint:#b3889c;
  --accent:#f0a8cc; --accent-deep:#d67eae; --accent-ink:#3a0f28;
  --gold:#ecc571; --good:#9cd9ac; --bad:#f0a2a2;
  --canvas:#f7e9ef; --canvas-ink:#8a6a7a;
  --shadow:0 12px 34px rgba(24,6,16,.5);
}
/* ============ BASE ============ */
*{box-sizing:border-box; margin:0; padding:0}
html{height:100%}
body{
  min-height:100%; background:
    radial-gradient(1100px 500px at 85% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
    radial-gradient(900px 500px at 5% 110%, color-mix(in srgb, var(--gold) 7%, transparent), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:"Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:16px; line-height:1.65;
  transition:background .4s ease, color .4s ease;
  padding-block:0 26px;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
button:disabled{opacity:.45; cursor:not-allowed}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
::selection{background:var(--accent); color:var(--accent-ink)}
/* ============ TOP BAR ============ */
#topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px clamp(10px,3vw,26px);
  background:color-mix(in srgb, var(--bg2) 88%, transparent);
  backdrop-filter:blur(7px); border-block-end:1px solid var(--line);
}
.brand{display:flex; flex-direction:column; margin-inline-end:auto; min-width:0}
.brand b{font-size:1.22rem; letter-spacing:.4px; color:var(--accent); text-shadow:0 2px 12px color-mix(in srgb, var(--accent) 40%, transparent)}
.brand span{font-size:.8rem; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hud{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px;
  background:var(--panel); border:1px solid var(--line); font-size:.9rem; white-space:nowrap;
}
.chip b{color:var(--gold); font-weight:600}
.chip.rep b{color:var(--accent)}
.tools{display:flex; gap:7px; flex-wrap:wrap}
/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 15px; border-radius:var(--rs); font-size:.93rem; font-weight:600;
  background:var(--panel2); border:1px solid var(--line2); color:var(--ink);
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1.5px); box-shadow:0 6px 16px rgba(0,0,0,.25); border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.primary{background:linear-gradient(140deg, var(--accent), var(--accent-deep)); color:var(--accent-ink); border-color:transparent}
.btn.good{background:color-mix(in srgb, var(--good) 20%, var(--panel2)); border-color:var(--good)}
.btn.danger{background:color-mix(in srgb, var(--bad) 16%, var(--panel2)); border-color:var(--bad)}
.btn.icon{padding:8px 11px; font-size:1.05rem; line-height:1}
.btn.tiny{padding:3px 9px; font-size:.8rem}
.btn[aria-pressed="true"]{background:color-mix(in srgb, var(--accent) 30%, var(--panel2)); border-color:var(--accent)}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:var(--rs); overflow:hidden}
.seg button{padding:6px 13px; font-size:.87rem; background:var(--panel); border-inline-end:1px solid var(--line); transition:background .2s}
.seg button:last-child{border-inline-end:none}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
/* ============ LAYOUT ============ */
#gameGrid{
  display:grid; gap:14px; padding:14px clamp(10px,2.6vw,24px);
  grid-template-columns:minmax(290px,1.05fr) minmax(340px,1.35fr) minmax(300px,1fr);
  align-items:start; max-width:1460px; margin-inline:auto;
}
.card{
  background:color-mix(in srgb, var(--panel) 92%, transparent);
  border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  padding:15px 16px;
}
.card>h2{font-size:1.02rem; color:var(--accent); display:flex; align-items:center; gap:8px; margin-block-end:9px; letter-spacing:.3px}
.card>h2 .sub{margin-inline-start:auto; font-size:.78rem; font-weight:400; color:var(--ink-dim)}
.divider{border:none; border-block-start:1px dashed var(--line2); margin-block:11px}
/* ============ CLIENT PANEL ============ */
#clientHead{display:flex; align-items:center; gap:10px}
#clientEmoji{font-size:2.2rem; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#clientName{font-size:1.15rem; color:var(--ink)}
#clientRole{font-size:.8rem; color:var(--ink-dim)}
.patience{display:flex; gap:4px; margin-inline-start:auto}
.patience i{width:12px; height:12px; border-radius:50%; background:var(--line2); transition:background .3s, transform .3s}
.patience i.on{background:var(--good); box-shadow:0 0 8px color-mix(in srgb, var(--good) 60%, transparent)}
.patience i.warn{background:var(--gold)}
blockquote#clientMemory{
  margin-block:10px 12px; padding:11px 14px; font-size:.95rem; font-style:italic;
  background:color-mix(in srgb, var(--panel2) 75%, transparent);
  border-inline-start:3px solid var(--accent); border-radius:var(--rs); color:var(--ink);
}
.h3mini{font-size:.82rem; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-dim); margin-block:8px 6px}
#hintList{list-style:none; display:grid; gap:6px}
#hintList li{
  padding:7px 11px; font-size:.9rem; border-radius:var(--rs);
  background:color-mix(in srgb, var(--gold) 7%, var(--panel2)); border:1px solid color-mix(in srgb, var(--gold) 25%, transparent);
}
#clueList{display:flex; flex-wrap:wrap; gap:7px}
.clue{
  padding:5px 12px; border-radius:99px; font-size:.83rem;
  background:var(--panel2); border:1px dashed var(--line2); color:var(--ink-dim);
  transition:all .25s ease; min-height:30px;
}
.clue.hidden{cursor:pointer; letter-spacing:3px; color:var(--accent)}
.clue.shown{border-style:solid; border-color:var(--accent); color:var(--ink); background:color-mix(in srgb, var(--accent) 12%, var(--panel2))}
#tipLine{margin-block-start:11px; font-size:.8rem; color:var(--faint); min-height:1.3em; transition:opacity .5s}
/* ============ BLOTTER ============ */
#blotterWrap{position:relative}
canvas#blotter{
  display:block; width:100%; aspect-ratio:5/4; border-radius:var(--rs);
  border:1px solid var(--line2); touch-action:none; cursor:crosshair;
  box-shadow:inset 0 0 40px rgba(0,0,0,.14); transition:box-shadow .3s;
}
canvas#blotter.pulse{box-shadow:inset 0 0 40px rgba(0,0,0,.14), 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent)}
#bloomBar{display:flex; height:9px; border-radius:99px; overflow:hidden; margin-block:9px 4px; border:1px solid var(--line2)}
#bloomBar i{flex:1; position:relative; background:var(--panel2)}
#bloomBar i::after{content:""; position:absolute; inset:0; background:var(--segc,#888); transform:scaleX(0); transform-origin:inline-start; transition:none}
#segTop{--segc:#e9c46a} #segMid{--segc:#d98cb3} #segBase{--segc:#9a6b4f}
#bloomMeta{display:flex; justify-content:space-between; font-size:.78rem; color:var(--ink-dim)}
#blotterBtns{display:flex; gap:7px; flex-wrap:wrap; margin-block-start:9px}
/* ============ SHELF ============ */
#shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px}
.shelf-item{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:8px 4px 6px; border-radius:var(--rs); text-align:center;
  background:var(--panel2); border:1px solid var(--line2); border-inline-start-width:4px;
  transition:transform .14s ease, box-shadow .2s, border-color .2s;
}
.shelf-item:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.3)}
.shelf-item .em{font-size:1.5rem; line-height:1.2}
.shelf-item .nm{font-size:.76rem; line-height:1.25; color:var(--ink)}
.shelf-item .meta{font-size:.68rem; color:var(--ink-dim); display:flex; gap:5px; align-items:center}
.shelf-item .dots{letter-spacing:1px; color:var(--gold); font-size:.62rem}
.shelf-item.selected{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent)}
.shelf-item .keynum{position:absolute; top:3px; inset-inline-start:6px; font-size:.62rem; color:var(--faint)}
.shelf-item.locked{opacity:.55; filter:grayscale(.7)}
.shelf-item.locked .em::after{content:" 🔒"; font-size:.85rem}
.shelf-item.poor{opacity:.5}
/* ============ VIAL ============ */
#vialArea{display:flex; gap:13px; align-items:stretch}
#vialSvg{width:96px; flex:none; filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
#vialRight{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px}
#vialStats{display:flex; gap:8px; font-size:.8rem; color:var(--ink-dim); flex-wrap:wrap}
#vialStats b{color:var(--gold); font-weight:600}
#vialChips{display:flex; flex-wrap:wrap; gap:6px; min-height:34px; align-content:flex-start}
.vchip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 6px 3px 10px; border-radius:99px;
  font-size:.8rem; background:var(--panel2); border:1px solid var(--line2);
  animation:chipIn .22s ease;
}
.vchip button{width:18px; height:18px; border-radius:50%; background:var(--bad); color:var(--accent-ink); font-size:.72rem; line-height:1; display:grid; place-items:center}
.vchip button:hover{transform:scale(1.12)}
#vialEmptyMsg{font-size:.82rem; color:var(--faint); font-style:italic}
#workBtns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-block-start:10px}
#workBtns .btn.serve{grid-column:1/-1; padding-block:11px; font-size:1rem}
@keyframes chipIn{from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1}}
/* ============ OVERLAYS & MODALS ============ */
.overlay{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:16px;
  background:rgba(12,4,12,.62); backdrop-filter:blur(5px);
  animation:fadeIn .25s ease;
}
.overlay[hidden]{display:none}
.modal{
  width:min(620px, 94vw); max-height:88vh; overflow:auto; padding:20px 22px;
  background:var(--panel); border:1px solid var(--line2); border-radius:18px; box-shadow:var(--shadow);
  animation:rise .3s ease;
}
.modal h2{color:var(--accent); font-size:1.25rem; margin-block-end:10px; display:flex; align-items:center; gap:9px}
.modal h2 .x{margin-inline-start:auto; font-size:.7em}
.modal p{margin-block:7px; color:var(--ink-dim); font-size:.94rem}
.modal p.strong{color:var(--ink)}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes rise{from{transform:translateY(16px) scale(.98); opacity:0} to{transform:none; opacity:1}}
.modalFoot{display:flex; gap:9px; justify-content:flex-end; margin-block-start:16px; flex-wrap:wrap}
/* ============ SETTINGS ROWS ============ */
.set-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding-block:9px; border-block-end:1px dashed var(--line);
}
.set-row>span:first-child{flex:1; min-width:130px; font-size:.93rem}
.set-row.danger span:first-child{color:var(--bad)}
/* ============ VERDICT ============ */
#vdList{list-style:none; display:grid; gap:7px; margin-block:10px}
#vdList li{
  display:flex; align-items:center; gap:9px; padding:7px 11px; border-radius:var(--rs);
  background:var(--panel2); border:1px solid var(--line2); font-size:.92rem;
}
#vdList .mark{font-size:1.05rem; width:1.4em; text-align:center}
#vdList .cnt{margin-inline-start:auto; color:var(--ink-dim); font-size:.83rem}
#vdLines{display:grid; gap:4px; font-size:.87rem; margin-block:8px}
#vdLines .pos{color:var(--good)} #vdLines .neg{color:var(--bad)} #vdLines .neu{color:var(--ink-dim)}
#vdPay{font-size:1.5rem; color:var(--gold); text-align:center; margin-block:6px; font-weight:700}
#vdPay small{font-size:.85rem; color:var(--ink-dim); font-weight:400}
/* ============ BOOK / LEDGER / STATS ============ */
.emptyMsg{color:var(--faint); font-style:italic; text-align:center; padding-block:18px; font-size:.9rem}
.recipe{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--rs);
  background:var(--panel2); border:1px solid var(--line2); margin-block-end:8px;
}
.recipe .rname{font-size:.9rem}
.recipe .rmix{font-size:.8rem; color:var(--ink-dim)}
.recipe .btn{margin-inline-start:auto}
table.ledgerT{width:100%; border-collapse:collapse; font-size:.85rem}
table.ledgerT th{color:var(--ink-dim); font-weight:600; text-align:start; padding:5px 7px; border-block-end:1px solid var(--line2); font-size:.78rem}
table.ledgerT td{padding:6px 7px; border-block-end:1px dashed var(--line); vertical-align:top}
.resWin{color:var(--good)} .resFail{color:var(--bad)} .resAged{color:var(--gold)} .resLost{color:var(--bad); font-weight:700}
.mixmini{font-size:.72rem; color:var(--faint)}
#statsGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; margin-block-end:14px}
.statBox{padding:10px 12px; border-radius:var(--rs); background:var(--panel2); border:1px solid var(--line2)}
.statBox b{display:block; font-size:1.3rem; color:var(--gold)}
.statBox span{font-size:.78rem; color:var(--ink-dim)}
#achGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:9px}
.achBox{padding:9px 11px; border-radius:var(--rs); background:var(--panel2); border:1px solid var(--line2); font-size:.82rem}
.achBox.got{border-color:var(--gold); background:color-mix(in srgb, var(--gold) 10%, var(--panel2))}
.achBox .aicon{font-size:1.25rem; margin-inline-end:5px}
.achBox.locked{opacity:.5; filter:grayscale(.8)}
.glossItem{padding-block:8px; border-block-end:1px dashed var(--line)}
.glossItem b{color:var(--accent)}
.glossItem p{font-size:.88rem}
/* ============ TOASTS ============ */
#toasts{position:fixed; inset-block-end:16px; inset-inline-start:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  padding:9px 18px; border-radius:99px; font-size:.9rem; max-width:88vw;
  background:color-mix(in srgb, var(--panel) 94%, transparent); border:1px solid var(--accent);
  box-shadow:var(--shadow); animation:toastIn .3s ease; text-align:center;
}
.toast.bad{border-color:var(--bad)} .toast.gold{border-color:var(--gold)}
@keyframes toastIn{from{transform:translateY(14px); opacity:0} to{transform:none; opacity:1}}
.toast.out{opacity:0; transition:opacity .5s}
/* ============ ONBOARDING DIAGRAM ============ */
.onbFig{display:flex; justify-content:center; margin-block:12px}
.onbFig svg{max-width:300px; width:100%; filter:drop-shadow(0 8px 20px rgba(0,0,0,.3))}
kbd{
  padding:1px 7px; border-radius:5px; font-family:inherit; font-size:.82em;
  background:var(--panel2); border:1px solid var(--line2); border-block-end-width:2.5px; color:var(--gold);
}
.ctlGrid{display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:.88rem; margin-block:8px}
.ctlGrid span{color:var(--ink-dim)}
.credit{margin-block-start:14px; padding-block-start:11px; border-block-start:1px dashed var(--line2); font-size:.82rem; color:var(--faint); text-align:center}
/* ============ MOTION / RESPONSIVE ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
body[data-motion="reduced"] *,body[data-motion="reduced"] *::before,body[data-motion="reduced"] *::after{
  animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;
}
@media (max-width:1080px){
  #gameGrid{grid-template-columns:1fr 1fr}
  #blotterPanel{order:3; grid-column:1/-1}
}
@media (max-width:700px){
  #gameGrid{grid-template-columns:1fr}
  .brand span{display:none}
  #vialArea{flex-direction:row}
}
</style>
</head>
<body data-theme="night">
<header id="topbar">
  <div class="brand">
    <b>عَبق <span data-i18n="brandEn"></span></b>
    <span data-i18n="tagline"></span>
  </div>
  <div class="hud">
    <span class="chip" id="hudDay">📅 <b id="dayVal">1</b></span>
    <span class="chip" id="hudCoins">🪙 <b id="coinVal">40</b></span>
    <span class="chip rep" id="hudRep">★ <b id="repVal">0</b></span>
    <span class="chip" id="hudPhase" hidden></span>
  </div>
  <nav class="tools" aria-label="tools">
    <button class="btn icon" id="btnBook" data-i18n-title="book" data-i18n-aria="book">📖</button>
    <button class="btn icon" id="btnLedger" data-i18n-title="ledger" data-i18n-aria="ledger">📜</button>
    <button class="btn icon" id="btnStats" data-i18n-title="stats" data-i18n-aria="stats">📊</button>
    <button class="btn icon" id="btnGloss" data-i18n-title="glossary" data-i18n-aria="glossary">📚</button>
    <button class="btn icon" id="btnAbout" data-i18n-title="about" data-i18n-aria="about">ⓘ</button>
    <button class="btn icon" id="btnSettings" data-i18n-title="settings" data-i18n-aria="settings">⚙️</button>
    <button class="btn icon" id="btnLang" aria-label="English / عربي">EN</button>
    <a class="btn icon" href="../index.html" data-i18n-title="backAria" data-i18n-aria="backAria">↩</a>
  </nav>
</header>

<main id="gameGrid">
  <!-- ===== CLIENT ===== -->
  <section class="card" id="clientPanel" aria-labelledby="clientH">
    <h2 id="clientH" data-i18n="clientH"></h2>
    <div id="clientHead">
      <span id="clientEmoji" aria-hidden="true">👤</span>
      <div>
        <div id="clientName">—</div>
        <div id="clientRole">—</div>
      </div>
      <div class="patience" id="clientPatience" role="img" data-i18n-aria="patienceAria"></div>
    </div>
    <blockquote id="clientMemory"></blockquote>
    <div class="h3mini" data-i18n="hintsH"></div>
    <ul id="hintList"></ul>
    <div class="h3mini" id="clueH" data-i18n="whispersH"></div>
    <div id="clueList"></div>
    <p id="tipLine"></p>
  </section>

  <!-- ===== BLOTTER ===== -->
  <section class="card" id="blotterPanel" aria-labelledby="blotterH">
    <h2 id="blotterH"><span data-i18n="blotterH"></span><span class="sub" id="bloomState"></span></h2>
    <div id="blotterWrap">
      <canvas id="blotter" role="img"></canvas>
    </div>
    <div id="bloomBar" aria-hidden="true"><i id="segTop"></i><i id="segMid"></i><i id="segBase"></i></div>
    <div id="bloomMeta"><span id="bloomTime">0s</span><span id="bloomHintTxt"></span></div>
    <div id="blotterBtns">
      <button class="btn primary" id="btnTest" data-i18n="testBtn"></button>
      <button class="btn" id="btnFF" aria-pressed="false" data-i18n="ffBtn"></button>
      <button class="btn" id="btnLabels" aria-pressed="true" data-i18n="labelsBtn"></button>
    </div>
  </section>

function mixCols(list){ /* weighted additive mix {col,w} → css rgb */

const AU = {
  ctx:null, master:null,
  ensure(){
    if (!this.ctx){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.42;
        this.master.connect(this.ctx.destination);
      }catch(e){ this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(()=>{});
    return !!this.ctx;
  },
  tone(f, d, type="sine", v=0.4, at=0, slide=0){
    if (!S.settings.sound || !this.ensure()) return;
    const t0 = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(30, f), t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + d + 0.06);
  },
  blip(){ this.tone(690, .1, "sine", .3, 0, 300); },                     // droplet added
  pop(){ this.tone(340, .07, "sine", .22, 0, -160); },                   // drop withdrawn
  click(){ this.tone(1150, .035, "triangle", .14); },                    // ui
  chime(i){ const sc=[523.25,587.33,659.25,783.99,880,1046.5], f=sc[i%sc.length];
    this.tone(f, .55, "triangle", .2); this.tone(f*2, .4, "sine", .07); },  // bloom ring arpeggio
  bell(){ [880,1108.73,1318.51].forEach((f,i)=>{ this.tone(f,.75,"sine",.2,i*.1); this.tone(f*2,.5,"sine",.05,i*.1); }); }, // success
  thud(){ this.tone(130,.3,"sine",.5,0,-70); this.tone(88,.34,"triangle",.3,.02,-30); }, // failure
  fanfare(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,.4,"triangle",.18,i*.12)); }, // unlock
};

  S.vial.items[id] = (S.vial.items[id] || 0) + 1;

function genClues(c){
  const rng = mulberry32(hashStr(c.id));
  const ess = c.formula.map(f => f[0]), cnts = c.formula.map(f => f[1]);
  const sum = cnts.reduce((a, b) => a + b, 0);
  const layers = [...new Set(c.formula.map(([id]) => ESSENCE_BY_ID[id].vol))];
  const builders = [
    () => ({ k:"clueTotal", vars:{n:sum} }),
    () => ({ k:"clueLayers", vars:{n:layers.length} }),
    () => { const f = ess[Math.floor(rng() * ess.length)];
      return { k:"clueFamily", vars:{fam:t(famKey(ESSENCE_BY_ID[f].fam))} }; },
    () => { const vol = layers[Math.floor(rng() * layers.length)];
      const n = c.formula.filter(([id]) => ESSENCE_BY_ID[id].vol === vol).reduce((a, [, n2]) => a + n2, 0);
      return { k:"clueLayerDrops", vars:{layer:t("vol" + vol), n} }; },
    () => { const cands = ESSENCES.filter(e => !ess.includes(e.id) && ess.some(f => clashes(f, e.id)) && isUnlocked(e));
      if (!cands.length) return null;
      const e = cands[Math.floor(rng() * cands.length)];
      return { k:"clueClash", vars:{ess:L(e.name)} }; },
    () => ess.some((a, i) => ess.slice(i + 1).some(b => affins(a, b)))
      ? { k:"clueFriends", g:"fr" } : { k:"clueNoFriends", g:"fr" },
    () => ({ k:"clueMax", vars:{n:Math.max(...cnts)} }),
    () => ({ k:"clueCost", vars:{c:Math.max(...c.formula.map(([id]) => ESSENCE_BY_ID[id].cost))} }),
    () => ess.some(id => ESSENCE_BY_ID[id].rare) ? { k:"clueRareYes" } : { k:"clueRareNo" },
  ];
  const order = builders.map((b, i) => i).sort(() => rng() - .5);
  const out = [], seen = new Set();
  const want = clamp(S.settings.hints + (S.rep >= 15 ? 1 : 0), 1, 4);
  for (const i of order){
    const cl = builders[i](); if (!cl) continue;
    const key = cl.g || cl.k; if (seen.has(key)) continue;
    seen.add(key); out.push(cl);
    if (out.length >= want) break;
  }
  return out;
}
function renderClues(){
  const box = $("clueList"); box.innerHTML = "";
  if (!S.cur) return;

    const b = document.createElement("button");

      S.cluesShown.push(i); AU.click(); save(); renderClues();
    });

  });
}

   9 · BLOTTER — the signature bloom simulation (canvas)

const blot = { cv:null, ctx:null, w:0, h:0, dpr:1, dirty:true, specks:[], ghosts:[], bloom:null };
const markBlotterDirty = () => { blot.dirty = true; };
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim() || "#efe3d0"; }
function setupBlotter(){
  blot.cv = $("blotter"); blot.ctx = blot.cv.getContext("2d");
  resizeBlotter();
}
function resizeBlotter(){
  const r = blot.cv.getBoundingClientRect();
  blot.dpr = Math.min(2, window.devicePixelRatio || 1);
  blot.cv.width = Math.max(2, Math.round(r.width * blot.dpr));
  blot.cv.height = Math.max(2, Math.round(r.height * blot.dpr));
  blot.w = blot.cv.width; blot.h = blot.cv.height;
  const rng = mulberry32(777); blot.specks = [];
  for (let i = 0; i < 240; i++) blot.specks.push({ x:rng(), y:rng(), a:.03 + rng() * .06, r:.5 + rng() * 1.3 });
  markBlotterDirty();
}
function pulseBlotter(){
  blot.cv.classList.remove("pulse"); void blot.cv.offsetWidth;
  blot.cv.classList.add("pulse");
  setTimeout(() => blot.cv.classList.remove("pulse"), 460);
}
function startBloom(){
  if (blot.bloom && blot.bloom.active){ toast(t("bloomRunning")); return; }
  if (!vialCount()){ toast(t("bloomNoVial"), "bad"); AU.thud(); return; }
  const layers = [[], [], []];
  Object.entries(S.vial.items).forEach(([id, n]) => layers[ESSENCE_BY_ID[id].vol].push({ id, n }));
  layers.forEach(l => l.sort((a, b) => ESSENCE_BY_ID[b.id].int - ESSENCE_BY_ID[a.id].int));
  const rings = []; let idx = 0;
  const minD = Math.min(blot.w, blot.h);
  for (let v = 0; v < 3; v++) layers[v].forEach((r, k) => {
    const e = ESSENCE_BY_ID[r.id];
    const ang = (hashStr(r.id) % 628) / 100;
    const dist = (hashStr(r.id + "d") % 55) / 100;
    const r1 = (15 + e.int * 4 + r.n * 6.5) * (minD / 430);
    rings.push({
      x: blot.w / 2 + Math.cos(ang) * dist * minD * .42,
      y: blot.h / 2 + Math.sin(ang) * dist * minD * .42,
      r1, col:e.col, start:v * 6.5 + k * 1.5 + .3, grow:5, idx:idx++,
      fadeR: v === 0 ? .22 : v === 1 ? .55 : 1,
      fadeA: v === 0 ? .38 : v === 1 ? .62 : 1,
      fadeFrom: v === 0 ? 9.5 : v === 1 ? 13 : 999,
      name:L(e.name), chimed:false,
    });
  });
  const dur = Math.max(...rings.map(r => r.start + r.grow)) + 2;
  blot.bloom = { active:true, t:0, rings, dur };
  $("bloomState").textContent = t("bloomStateRun");
  $("bloomHintTxt").textContent = "";
  AU.click(); save();
}
function updateBloom(dt){
  const b = blot.bloom; if (!b || !b.active) return;
  const mult = Math.max(1, S.settings.bloom) * (S.ff ? 3 : 1);
  b.t += dt * mult;
  for (const r of b.rings) if (!r.chimed && b.t >= r.start){ r.chimed = true; AU.chime(r.idx); }
  updateBloomBar();
  if (b.t >= b.dur) finishBloom();
  markBlotterDirty();
}
function finishBloom(){
  const b = blot.bloom; if (!b) return;
  b.active = false;
  blot.ghosts.push(b.rings.map(r => {
    const f = r.fadeFrom === 999 ? 0 : clamp((b.dur - r.fadeFrom) / 6, 0, 1);
    return { x:r.x, y:r.y, r:r.r1 * lerp(1, r.fadeR, f), col:r.col, a:.85 * lerp(1, r.fadeA, f) };
  }));
  if (blot.ghosts.length > 3) blot.ghosts.shift();
  $("bloomState").textContent = t("bloomStateDone");
  $("bloomTime").textContent = Math.ceil(b.dur) + "s";
  AU.chime(4); markBlotterDirty();
}
function updateBloomBar(){
  const b = blot.bloom; if (!b) return;
  ["segTop", "segMid", "segBase"].forEach((id, i) => {
    const p = clamp((b.t - i * 6.5) / 6.5, 0, 1);
    $(id).style.transform = `scaleX(${p})`;
  });
}
function drawBlotter(){
  const g = blot.ctx, w = blot.w, h = blot.h; if (!g) return;
  g.clearRect(0, 0, w, h);
  g.fillStyle = cssVar("--canvas"); g.fillRect(0, 0, w, h);
  const ink = cssVar("--canvas-ink");
  g.fillStyle = ink;
  for (const s of blot.specks){
    g.globalAlpha = s.a;
    g.beginPath(); g.arc(s.x * w, s.y * h, s.r * blot.dpr, 0, 6.29); g.fill();
  }
  g.globalAlpha = 1;
  const drawRing = (x, y, r, col, a) => {
    const c = hexRgb(col);
    const gr = g.createRadialGradient(x, y, Math.max(1, r * .12), x, y, Math.max(2, r));
    gr.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${a * .5})`);
    gr.addColorStop(.82, `rgba(${c.r},${c.g},${c.b},${a * .85})`);
    gr.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
    g.strokeStyle = `rgba(${c.r},${c.g},${c.b},${Math.min(1, a + .15)})`;
    g.lineWidth = 1.4 * blot.dpr; g.stroke();
  };
  for (const gh of blot.ghosts) for (const r of gh) drawRing(r.x, r.y, r.r, r.col, r.a * .3);
  const b = blot.bloom;
  if (b) for (const r of b.rings){
    const age = b.t - r.start; if (age <= 0) continue;
    const grow = easeOut(age / r.grow);
    let rad = r.r1 * (.12 + .88 * grow), a = .85 * Math.min(1, age / .8);
    if (age > r.fadeFrom){
      const f = clamp((age - r.fadeFrom) / 6, 0, 1);
      rad *= lerp(1, r.fadeR, f); a *= lerp(1, r.fadeA, f);
    }
    drawRing(r.x, r.y, rad, r.col, a);
    if (S.settings.labels && age > .6){
      g.globalAlpha = .55; g.fillStyle = ink;
      g.font = `${11 * blot.dpr}px "Segoe UI",Tahoma,system-ui,sans-serif`;
      g.textAlign = "center";
      g.fillText(r.name, r.x, Math.min(h - 6, r.y + rad + 13 * blot.dpr));
      g.globalAlpha = 1;
    }
  }
}
function renderBlotterChrome(){

  $("bloomHintTxt").textContent = t("bloomHintTxt");

let tipIdx = 0;
function serve(){
  if (openStack.length) return;
  if (!S.cur) return;
  if (!vialCount()){ toast(t("vialEmpty"), "bad"); AU.thud(); return; }
  const c = S.cur, items = { ...S.vial.items };
  const details = c.formula.map(([id, n]) => {
    const vc = items[id] || 0;
    return { id, n, vc, st: !vc ? "no" : (Math.abs(vc - n) <= 1 ? "ok" : "near") };
  });
  const matched = details.filter(d => d.st !== "no");
  const okAll = matched.length >= 2 && matched.every(d => d.st === "ok");
  const perfect = details.every(d => d.st === "ok");
  const vIds = Object.keys(items);
  let pay = c.pay; const lines = [];
  if (okAll){
    if (vIds.some((a, i) => vIds.slice(i + 1).some(b => affins(a, b)))){ pay *= 1.1; lines.push({ k:"bonusAffin", cls:"pos" }); }
    const hasClash = vIds.some((a, i) => vIds.slice(i + 1).some(b => clashes(a, b)));
    if (hasClash){
      if (S.vial.mellowed) lines.push({ k:"lineMellowed", cls:"neu" });
      else { pay *= .75; lines.push({ k:"malusClash", cls:"neg" }); }
    }
    if (perfect){ pay *= 1.25; lines.push({ k:"bonusPerfect", cls:"pos" }); }
  }
  pay = Math.round(pay);
  S.stats.served++;
  if (okAll){
    S.coins += pay; S.stats.success++; S.stats.earned += pay;
    S.stats.streak++; S.stats.best = Math.max(S.stats.best, S.stats.streak);
    if (perfect) S.stats.perfect++;
    const repGain = perfect ? 3 : 2; S.rep += repGain;
    if (!S.book.some(b => b.cid === c.id)) S.book.push({ cid:c.id, name:c.name, ess:c.formula.map(([id, n]) => [id, n]) });
    pushLedger({ d:S.day, nm:c.name, res:perfect ? "perfect" : "win", pay, ess:vIds.map(id => [id, items[id]]) });
    if (S.phase === "endless") S.weekEarn += pay;
    S.vial = { items:{}, order:[], mellowed:false };
    AU.bell();
    showVerdict({ ok:true, perfect, details, pay, repGain, lines, c, advance:true });
  } else {
    S.strikes++; S.stats.streak = 0;
    S.vial = { items:{}, order:[], mellowed:false };

    } else {
      pushLedger({ d:S.day, nm:c.name, res:"fail", pay:0, ess:vIds.map(id => [id, items[id]]) });
    }
    showVerdict({ ok:false, perfect:false, details, pay:0, repGain:0, lines, c, advance:lost, reveal:lost });
  }

}

const weekTarget = () => 70 + 25 * (S.week - 1);
function storyClient(i){

function genClient(){
  S.seed = (Math.imul(S.seed, 1103515245) + 12345) >>> 0;
  const rng = mulberry32(S.seed);
  const pers = GEN_NAMES[Math.floor(rng() * GEN_NAMES.length)];
  const pool = ESSENCES.filter(e => isUnlocked(e));
  const picks = [...pool].sort(() => rng() - .5).slice(0, 3);
  const counts = [1 + Math.floor(rng() * 4), 1 + Math.floor(rng() * 4), 1 + Math.floor(rng() * 4)];
  let tot = counts.reduce((a, b) => a + b, 0);
  while (tot > 9){ const i = counts.indexOf(Math.max(...counts)); counts[i]--; tot--; }
  const formula = picks.map((e, i) => [e.id, counts[i]]);
  const pay = Math.round(24 + tot * 3 + Math.min(S.rep, 24) * 1.2 + rng() * 8);
  let dom = 0; counts.forEach((c, i) => { if (c > counts[dom]) dom = i; });
  const dominant = picks[dom];
  const topDrops = formula.filter(([id]) => ESSENCE_BY_ID[id].vol === 0).reduce((a, [, n]) => a + n, 0);
  const o = GEN_OPEN[Math.floor(rng() * GEN_OPEN.length)];
  const f = GEN_FAM[dominant.fam];
  const cl = GEN_CLOSE[Math.floor(rng() * GEN_CLOSE.length)];
  return {
    id:"g" + S.seed, em:pers.em, name:pers.name,
    role:{ ar:"زبونٌ من السوقِ الأسبوعيّ", en:"a client of the weekly souq" },
    mem:{ ar:`${o.ar} ${f.ar}، ${cl.ar}`, en:`${o.en} ${f.en}, ${cl.en}` },
    formula, pay,
    hints:[
      topDrops >= 2 ? { k:"genH1a" } : { k:"genH1b" },
      { k:"genH2", vars:{ fam:t(famKey(dominant.fam)) } },
      { k:"genH3" },
    ],
  };
}

    d.innerHTML = `<div><div class="rname">${L(rec.name)}</div>` +
      `<div class="rmix">${rec.ess.map(([id, n]) => { const e = ESSENCE_BY_ID[id]; return `${e.em}×${n}`; }).join(" + ")} · ${cost}🪙</div></div>` +
      `<button class="btn tiny">${t("bookLoad")}</button>`;
    d.querySelector("button").addEventListener("click", () => loadRecipe(S.book[i]));
    box.appendChild(d);
  });
}
function renderLedger(){
  const box = $("ledgerBody");
  if (!S.ledger.length){ box.innerHTML = `<div class="emptyMsg">${t("ledgerEmpty")}</div>`; return; }
  const cls = { win:"resWin", perfect:"resWin", fail:"resFail", lost:"resLost", aged:"resAged" };
  box.innerHTML = `<table class="ledgerT"><thead><tr>` +
    ["ledgerDay","ledgerClient","ledgerRes","ledgerPay","ledgerMix"].map(k => `<th>${t(k)}</th>`).join("") +
    `</tr></thead><tbody>` +
    S.ledger.map(e => `<tr><td>${e.d}</td><td>${L(e.nm)}</td>` +
      `<td class="${cls[e.res] || ""}">${t("res" + e.res[0].toUpperCase() + e.res.slice(1))}</td>` +
      `<td>${e.pay ? e.pay + "🪙" : "—"}</td>` +
      `<td class="mixmini">${e.ess.map(([id, n]) => { const x = ESSENCE_BY_ID[id]; return x ? x.em + "×" + n : "?"; }).join(" ")}</td></tr>`).join("") +
    `</tbody></table>`;
}
function renderStats(){
  const st = S.stats;
  const fams = new Set(S.usedEss.map(id => ESSENCE_BY_ID[id] && ESSENCE_BY_ID[id].fam).filter(Boolean));
  const pct = st.served ? Math.round(100 * st.success / st.served) + "%" : "—";
  const boxes = [[st.served,"stServed"],[pct,"stSuccess"],[st.perfect,"stPerfect"],[st.earned,"stEarned"],
    [st.streak,"stStreak"],[st.best,"stBest"],[S.day,"stDays"],[fams.size,"stFam"],[S.book.length,"stRecipes"]];
  $("statsGrid").innerHTML = boxes.map(([v, k]) => `<div class="statBox"><b>${v}</b><span>${t(k)}</span></div>`).join("");
  $("achGrid").innerHTML = ACH.map(a => {
    const got = S.ach.includes(a.id);
    return `<div class="achBox ${got ? "got" : "locked"}" title="${L(a.d)}">` +
      `<span class="aicon">${a.icon}</span><b>${L(a.n)}</b><br><span>${L(a.d)}</span></div>`;
  }).join("");
}
function renderGloss(){
  $("glossList").innerHTML = GLOSSARY.map(g =>
    `<div class="glossItem"><b>${t(g.t)}</b><p>${L(g.d)}</p></div>`).join("");
}
function startTips(){
  const el = $("tipLine");
  el.textContent = "💡 " + L(TIPS[0]);
  setInterval(() => {
    if (document.hidden || openStack.length) return;
    tipIdx = (tipIdx + 1) % TIPS.length;
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = "💡 " + L(TIPS[tipIdx]); el.style.opacity = 1; }, 420);
  }, 9000);
}
/* ============================================================
   13 · INPUT — full keyboard (1–14, B/F/Enter/Esc/arrows) + pointer
   ============================================================ */
function fireSlot(n){
  const i = clamp(n, 1, 14) - 1;
  shelfSel = i; addDrop(ESSENCES[i].id);
}
function feedDigit(d){
  if (feedDigit.pend !== null){
    const p = feedDigit.pend; feedDigit.pend = null; clearTimeout(feedDigit.tm);
    const n = p * 10 + d;
    if (n >= 10 && n <= 14){ fireSlot(n); return; }
    fireSlot(p);
    if (d >= 2 && d <= 9) fireSlot(d); else if (d === 0) fireSlot(10);
    return;
  }
  if (d === 1){
    feedDigit.pend = 1;
    feedDigit.tm = setTimeout(() => { feedDigit.pend = null; fireSlot(1); }, 330);
    return;
  }
  fireSlot(d === 0 ? 10 : d);
}
feedDigit.pend = null;
function toggleFF(){
  S.ff = !S.ff;
  $("btnFF").setAttribute("aria-pressed", String(S.ff));
  AU.click();
}
function moveSel(step){
  shelfSel = (shelfSel + step + ESSENCES.length) % ESSENCES.length;
  renderShelf();
  const el = $("shelf").children[shelfSel];
  if (el) el.scrollIntoView({ block:"nearest" });
}
function bindShell(){
  $("btnBook").addEventListener("click", () => { renderBook(); openOv("ovBook"); AU.click(); });
  $("btnLedger").addEventListener("click", () => { renderLedger(); openOv("ovLedger"); AU.click(); });
  $("btnStats").addEventListener("click", () => { renderStats(); openOv("ovStats"); AU.click(); });
  $("btnGloss").addEventListener("click", () => { renderGloss(); openOv("ovGloss"); AU.click(); });
  $("btnAbout").addEventListener("click", () => { renderAbout(); openOv("ovAbout"); AU.click(); });
  $("btnSettings").addEventListener("click", () => { syncSettingsUI(); openOv("ovSettings"); AU.click(); });
  $("btnLang").addEventListener("click", toggleLang);
  $("onbBtn").addEventListener("click", () => { store.set("abq_seen", true); closeOv("ovOnboard"); AU.click(); });
  $("aboutOnb").addEventListener("click", () => { openOv("ovOnboard"); AU.click(); });
  $("seBtn").addEventListener("click", beginEndless);
  $("btnTest").addEventListener("click", startBloom);
  $("btnFF").addEventListener("click", toggleFF);
  $("btnLabels").addEventListener("click", () => {
    S.settings.labels = !S.settings.labels; syncSettingsUI(); save(); markBlotterDirty(); AU.click();
  });
  $("btnServe").addEventListener("click", serve);
  $("btnClear").addEventListener("click", clearVial);
  $("btnAge").addEventListener("click", ageOvernight);
  $("blotter").addEventListener("pointerdown", e => { e.preventDefault(); startBloom(); });
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => {
    const ov = b.closest(".overlay"); if (ov) closeOv(ov.id); AU.click();
  }));
  window.addEventListener("keydown", e => {
    if (e.defaultPrevented) return;
    const tag = (e.target && e.target.tagName) || "";
    if (e.key === "Escape"){
      const top = openStack[openStack.length - 1];
      if (top && top !== "ovVerdict" && top !== "ovConfirm"){ e.preventDefault(); closeTop(); }
      return;
    }
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (openStack.length) return; // decision dialogs & panels swallow the rest
    const k = e.key;
    if (/^[0-9]$/.test(k)){ e.preventDefault(); feedDigit(+k); return; }
    if (k === "Backspace"){ e.preventDefault(); removeLast(); return; }
    if (k === "b" || k === "B"){ e.preventDefault(); startBloom(); return; }
    if (k === "f" || k === "F"){ e.preventDefault(); toggleFF(); return; }
    if (k === "Enter"){
      if (tag !== "BUTTON" && tag !== "A"){ e.preventDefault(); serve(); }
      return;
    }
    if (k === " " || k === "Spacebar"){
      if (tag !== "BUTTON" && tag !== "A"){ e.preventDefault(); addDrop(ESSENCES[shelfSel].id); }
      return;
    }
    if (k === "ArrowRight" || k === "ArrowLeft" || k === "ArrowUp" || k === "ArrowDown"){
      e.preventDefault();
      const rtl = S.lang === "ar" ? -1 : 1;
      if (k === "ArrowRight") moveSel(rtl);
      else if (k === "ArrowLeft") moveSel(-rtl);
      else moveSel(k === "ArrowUp" ? -4 : 4);
      return;
    }
  });
  window.addEventListener("pointerdown", () => AU.ensure(), { once:true, capture:true });
  let rsTm = 0;
  window.addEventListener("resize", () => { clearTimeout(rsTm); rsTm = setTimeout(resizeBlotter, 160); });
}
/* ============================================================
   14 · MAIN LOOP & INIT — rAF, dt clamp, pause when hidden
   ============================================================ */
let rafId = 0, lastTs = 0, hiddenTab = false, timeTxtAt = 0;
function loop(ts){
  rafId = requestAnimationFrame(loop);
  if (hiddenTab){ lastTs = ts; return; }
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  const b = blot.bloom;
  if (b && b.active){
    updateBloom(dt);
    if (ts - timeTxtAt > 250){
      timeTxtAt = ts;
      $("bloomTime").textContent = Math.floor(b.t) + "s / " + Math.ceil(b.dur) + "s";
    }
  }
  if (blot.dirty){ blot.dirty = false; drawBlotter(); }
}
function init(){
  loadState();
  document.body.dataset.theme = S.settings.theme;
  document.body.dataset.motion = S.settings.motion;
  bindShell();
  buildShelf();
  setupBlotter();
  if (!S.cur){
    S.cur = pickNextClient();
    if (!S.cur) storyComplete();
  }
  applyLang();
  syncSettingsUI();
  renderHud(); renderVial(); renderBlotterChrome();
  startTips();
  if (!store.get("abq_seen", false)) openOv("ovOnboard");
  lastTs = performance.now();
  rafId = requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => { hiddenTab = document.hidden; });
init();
</script>
