<!-- 10 Originals — The Three Winds — original concept, 100% offline -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>الرياح الثلاث — The Three Winds</title>
<style>
/* == 1. Theme variables ============================================== */
:root{
  --bg:#201829; --bg2:#171021; --panel:#2b2138; --panel2:#231b2f; --line:#463655;
  --ink:#f4ead9; --muted:#c9b7a5; --accent:#e0b083; --accent-ink:#2c1c0e;
  --accent-soft:rgba(224,176,131,.16);
  --blue:#8fc1d4; --good:#9cc98a; --warn:#e6b455; --danger:#e07a5f;
  --shadow:0 12px 32px rgba(0,0,0,.45); --r:14px;
}
[data-theme="sand"]{
  --bg:#2c1a0e; --bg2:#1f1006; --panel:#3d2715; --panel2:#33200f; --line:#5f3e20;
  --ink:#f9ecd4; --muted:#d6ba97; --accent:#e8a44b; --accent-ink:#331903;
  --accent-soft:rgba(232,164,75,.18);
  --blue:#dd8b52; --good:#b2c46e; --warn:#f0bd5e; --danger:#e2694a;
}
[data-theme="moon"]{
  --bg:#0e1620; --bg2:#0a1017; --panel:#17232f; --panel2:#121d27; --line:#2d4356;
  --ink:#e9f0f6; --muted:#a8bdcc; --accent:#a3c4da; --accent-ink:#0d1a24;
  --accent-soft:rgba(163,196,218,.16);
  --blue:#7fa8c2; --good:#8fbf9f; --warn:#d9c47a; --danger:#d97e6e;
}
/* == 2. Base ========================================================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--ink);
  background:radial-gradient(1100px 700px at 75% -10%, var(--panel) 0%, var(--bg) 55%) fixed;
  font:15px/1.55 "Segoe UI",Tahoma,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
h1,h2,h3,h4{line-height:1.25}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent);color:var(--accent-ink)}
kbd{
  font:600 11px/1 "Segoe UI",Tahoma,sans-serif; background:var(--panel2);
  border:1px solid var(--line); border-block-end-width:2px; border-radius:6px;
  padding:3px 7px; color:var(--muted); white-space:nowrap;
}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-block-end:10px}
.closex{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);font-size:16px;flex:none;
}
.closex:hover{border-color:var(--danger);color:var(--danger)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-block-start:14px}
.btn{
  border:1px solid var(--line); background:var(--panel2); padding:10px 16px;
  border-radius:12px; font-weight:600;
  transition:filter .15s ease, transform .15s ease, border-color .15s ease;
}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger:hover{background:rgba(224,122,95,.14)}
.btn.wide{width:100%;justify-content:center;text-align:center}
.btn.slim{padding:7px 12px;font-size:13.5px;font-weight:500}
.sub{font-size:12.5px;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
/* == 3. Top bar ====================================================== */
#topbar{
  position:sticky; inset-block-start:0; z-index:30; display:flex; align-items:center; gap:8px;
  padding:10px clamp(10px,3vw,22px);
  background:rgba(14,9,20,.74); border-block-end:1px solid var(--line);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
[data-theme="sand"] #topbar{background:rgba(28,14,4,.76)}
[data-theme="moon"] #topbar{background:rgba(6,10,15,.76)}
#ttl{margin:0;font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:10px;min-width:0}
#ttl small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.4px}
.spacer{flex:1}
.iconbtn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);font-size:17px;display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s ease, background .15s ease; flex:none;
}
.iconbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.iconbtn.langb{width:auto;padding-inline:14px;font-weight:700;letter-spacing:.3px}
/* == 4. Main layout & route screen =================================== */
main{max-width:1080px;margin-inline:auto;padding:18px clamp(12px,3vw,24px) 40px}
#routeScreen h2{font-size:24px;margin:6px 0 4px}
#routeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px;margin-block-start:16px}
.rcard{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow);
  transition:transform .18s ease, border-color .18s ease; text-align:start; cursor:pointer;
}
.rcard:hover,.rcard:focus-visible{transform:translateY(-3px);border-color:var(--accent)}
.rcard .ricon{font-size:30px;line-height:1}
.rcard h3{margin:0;font-size:17.5px}
.rcard p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.rbest{font-size:13px;color:var(--blue)}
.rcard .golink{align-self:flex-start}
.rcard.resume{border-color:var(--warn)}
#gameScreen{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
#stageCol{min-width:0}
#stageFrame{
  background:var(--panel2); border:1px solid var(--line); border-radius:var(--r);
  padding:10px; box-shadow:var(--shadow); max-width:660px; margin-inline:auto;
}
canvas#stage{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:8px;touch-action:none;cursor:crosshair}
#tipsBar{
  max-width:660px;margin:10px auto 0;font-size:13.5px;color:var(--muted);
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px;min-height:36px;transition:opacity .3s ease;
}
#tipsBar .tipkey{color:var(--accent);font-weight:700}
#tipsBar.fade{opacity:0}
/* == 5. HUD =========================================================== */
#hud{
  display:flex;flex-direction:column;gap:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);
}
.statrow{display:flex;gap:8px}
.stat{
  flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:8px 6px;text-align:center;
}
.stat b{font-size:21px;display:block;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.season b{color:var(--warn)}
.hudblock h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
#stormWarn{
  color:var(--danger);font-weight:700;font-size:13.5px;text-align:center;
  border:1px dashed var(--danger);border-radius:10px;padding:6px;
}
#forecastRow{display:flex;gap:6px;flex-wrap:wrap}
.fc{
  display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;
  padding:4px 9px;background:var(--panel2);font-size:12.5px;white-space:nowrap;
  transition:border-color .15s ease;
}
.fc .arr{font-size:15px;line-height:1;color:var(--blue)}
.fc.tonight{border-color:var(--accent)}
.fc.tonight .arr{color:var(--accent)}
.fc.storm{border-color:var(--danger)}
.fc.storm .arr{color:var(--danger)}
#shelterBox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
#shelterLine{font-weight:700;font-size:14px}
#shelterLine.safe{color:var(--good)}
#shelterLine.risk{color:var(--danger)}
#shelterHint{margin-block-start:4px}
#toolRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toolbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;
  border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  transition:border-color .15s ease, background .15s ease;
}
.toolbtn svg{width:22px;height:22px}
.toolbtn span{font-size:12.5px}
.toolbtn kbd{font-size:10px;padding:2px 5px}
.toolbtn:hover{border-color:var(--accent)}
.toolbtn.active{border-color:var(--accent);background:var(--accent-soft)}
#endDayBtn{width:100%;padding:12px;font-size:15.5px}
#dpad{display:none;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;padding-block-start:2px}
body[data-touch="on"] #dpad{display:grid}
.dpb{
  height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  font-size:16px;display:flex;align-items:center;justify-content:center;
}
.dpb:active{background:var(--accent-soft);border-color:var(--accent)}
#dpC{border-color:var(--accent);color:var(--accent);font-weight:700}
/* == 6. Overlays & modals ============================================= */
.overlay{
  position:fixed;inset:0;background:rgba(8,5,14,.62);display:grid;place-items:center;
  z-index:50;padding:16px;
}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;
  box-shadow:var(--shadow);animation:pop .22s ease;
}
.modal.small{max-width:420px}
.modal.end{max-width:470px;text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 8px;font-size:20px}
.modal .svgwrap{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-block:6px}
.svgcap{text-align:center;margin:2px 0 10px}
.setrow{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 0;border-block-end:1px dashed var(--line);
}
.setrow:last-child{border-block-end:0}
.setrow .lab{font-weight:600}
.switch{
  position:relative;width:52px;height:28px;border-radius:20px;flex:none;
  border:1px solid var(--line);background:var(--panel2);transition:background .2s ease,border-color .2s ease;
}
.switch::after{
  content:"";position:absolute;inset-block-start:2px;inset-inline-start:2px;
  width:22px;height:22px;border-radius:50%;background:var(--muted);
  transition:inset-inline-start .2s ease, background .2s ease;
}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:26px;background:var(--accent-ink)}
.seg{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;border:1px solid var(--line);flex:none}
.seg button{padding:6px 11px;border-radius:9px;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ctrl{margin:6px 0;padding-inline-start:20px}
.ctrl li{margin-block:5px}
.credit{
  border:1px solid var(--line);border-inline-start:3px solid var(--accent);
  border-radius:8px;padding:8px 12px;color:var(--muted);font-size:13.5px;
}
.keytab{width:100%;border-collapse:collapse}
.keytab td{padding:7px 6px;border-block-end:1px dashed var(--line);font-size:14px}
.keytab td:last-child{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
/* == 7. Records & achievements ======================================== */
#recBody h3{margin:14px 0 6px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.brow{
  display:flex;align-items:baseline;gap:10px;padding:6px 2px;
  border-block-end:1px dashed var(--line);font-size:14px;
}
.brow span:first-child{flex:1}
.brow b{color:var(--accent);font-size:16px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;
  display:flex;flex-direction:column;gap:2px;color:var(--muted);
}
.ach .ic{font-size:20px}
.ach b{font-size:13px;color:var(--ink)}
.ach.got{border-color:var(--warn);background:var(--accent-soft)}
.ach.got .ic{filter:none}
/* == 8. End screen ==================================================== */
#endArt{display:flex;justify-content:center;margin-block-end:4px}
#endRows{margin-block:12px}
#endRows .erow{
  display:flex;justify-content:space-between;gap:12px;padding:7px 6px;
  border-block-end:1px dashed var(--line);font-size:14.5px;
}
#endRows .erow b{color:var(--accent);font-size:16px}
#endRows .score b{font-size:24px;color:var(--warn)}
.newbest{
  display:inline-block;background:var(--warn);color:#3a2504;font-weight:800;
  border-radius:20px;padding:3px 14px;font-size:13px;margin-block-start:8px;
  animation:blink 1.1s ease infinite alternate;
}
@keyframes blink{from{opacity:.75}to{opacity:1}}
/* == 9. Toasts ======================================================== */
#toasts{
  position:fixed;inset-block-end:16px;inset-inline-start:0;inset-inline-end:0;
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;pointer-events:none;
}
.toast{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:9px 18px;border-radius:12px;box-shadow:var(--shadow);
  max-width:84vw;font-size:14px;animation:tin .25s ease;transition:opacity .35s ease;
}
.toast.good{border-color:var(--good)}
.toast.bad{border-color:var(--danger)}
.toast.gold{border-color:var(--warn);color:var(--warn)}
.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* == 10. Responsive & motion ========================================== */
@media (max-width:900px){
  #gameScreen{grid-template-columns:1fr}
  #ttl small{display:none}
}
@media (max-width:520px){
  body{font-size:14.5px}
  .stat b{font-size:18px}
  .iconbtn{width:37px;height:37px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
<header id="topbar">
  <a id="backLink" href="../index.html" aria-label="العودة إلى الفهرس" data-i18n-aria="back" title="↩">↩</a>
  <h1 id="ttl"><span data-i18n="app_title">الرياح الثلاث</span><small dir="ltr">The Three Winds</small></h1>
  <span class="spacer"></span>
  <button id="btnRecords" class="iconbtn" aria-label="السجلّ" data-i18n-aria="records" title="🏆">🏆</button>
  <button id="btnAbout" class="iconbtn" aria-label="حول" data-i18n-aria="about" title="ⓘ">ⓘ</button>
  <button id="btnSettings" class="iconbtn" aria-label="الإعدادات" data-i18n-aria="settings" title="⚙">⚙</button>
  <button id="btnLang" class="iconbtn langb" aria-label="English">EN</button>
</header>
<main>
  <section id="routeScreen">
    <h2 data-i18n="routes_t">اختر مسار عبورك</h2>
    <p class="lead" data-i18n="routes_s"></p>
    <div id="routeGrid" role="list"></div>
  </section>
  <section id="gameScreen" hidden>
    <div id="stageCol">
      <div id="stageFrame">
        <canvas id="stage" width="720" height="720" role="img" data-i18n-aria="canvas_desc" aria-label=""></canvas>
      </div>
      <div id="tipsBar"></div>
    </div>
    <aside id="hud" aria-label="لوحة اللعب">
      <div class="statrow">
        <div class="stat"><b id="waterVal">12</b><span data-i18n="water"></span></div>
        <div class="stat" id="dayStat"><b id="dayVal">1</b><span id="dayLab" data-i18n="day"></span></div>
        <div class="stat"><b id="actVal">3</b><span data-i18n="actions"></span></div>
      </div>
      <div id="stormWarn" data-i18n="storm_warn" hidden></div>
      <div class="hudblock">
        <h3 data-i18n="forecast"></h3>
        <div id="forecastRow"></div>
        <div class="sub" style="margin-block-start:5px" data-i18n="drift_hint"></div>
      </div>
      <div id="shelterBox">
        <div id="shelterLine"></div>
        <div id="shelterHint" class="sub" data-i18n="shelter_hint"></div>
      </div>
      <div class="hudblock">
        <h3 data-i18n="tools_t"></h3>
        <div id="toolRow"></div>
        <button id="endDayBtn" class="btn primary" data-i18n="end_day"></button>
      </div>
      <div id="dpad"></div>
      <button id="quitBtn" class="btn danger slim" data-i18n="quit"></button>
    </aside>
  </section>
</main>
</div>

<!-- ============ Onboarding ============ -->
<div class="overlay" id="ovOnboard" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="obT">
    <h2 id="obT" data-i18n="onboard_t"></h2>
    <div class="svgwrap">
      <svg viewBox="0 0 340 130" width="100%" height="110" aria-hidden="true">
        <circle cx="296" cy="26" r="14" fill="#f0c26a"/>
        <path d="M0 100 Q85 58 170 92 T340 86 L340 130 L0 130 Z" fill="#cfa26f"/>
        <path d="M0 112 Q110 82 210 106 T340 102 L340 130 L0 130 Z" fill="#a9744a" opacity=".85"/>
        <g stroke="#8fc1d4" fill="none" stroke-width="3.2" stroke-linecap="round">
          <path d="M20 34 h58 m0 0 l-11 -7 m11 7 l-11 7"/>
          <path d="M34 56 h44 m0 0 l-11 -7 m11 7 l-11 7"/>
          <path d="M48 78 h30 m0 0 l-11 -7 m11 7 l-11 7"/>
        </g>
        <g fill="#e0b083" opacity=".85">
          <circle cx="112" cy="60" r="2.2"/><circle cx="122" cy="70" r="1.8"/><circle cx="106" cy="80" r="1.6"/>
        </g>
        <path d="M242 96 l17 -28 l17 28 Z" fill="#2b2138" stroke="#e0b083" stroke-width="2"/>
        <path d="M252 96 l7 -12 l7 12 Z" fill="#e0b083" opacity=".55"/>
      </svg>
    </div>
    <p class="svgcap sub" data-i18n="onboard_cap"></p>
    <p data-i18n="onboard_p1"></p>
    <p data-i18n="onboard_p2"></p>
    <button id="onboardOk" class="btn primary wide" data-i18n="onboard_ok"></button>
  </div>
</div>

<!-- ============ Settings ============ -->
<div class="overlay" id="ovSettings" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="stT">
    <div class="mhead"><h2 id="stT" data-i18n="set_t"></h2><button class="closex" data-close aria-label="✕">✕</button></div>
    <div class="setrow"><span class="lab" data-i18n="sound"></span><button id="swSound" class="switch" role="switch" aria-checked="true" data-i18n-aria="sound"></button></div>
    <div class="setrow"><span class="lab" data-i18n="motion"></span><button id="swMotion" class="switch" role="switch" aria-checked="true" data-i18n-aria="motion"></button></div>
    <div class="setrow"><span class="lab" data-i18n="fury"></span>
      <div class="seg" data-k="fury"><button data-v="gentle" data-i18n="fury_g"></button><button data-v="normal" data-i18n="fury_n"></button><button data-v="violent" data-i18n="fury_v"></button></div>
    </div>
    <div class="setrow"><span class="lab" data-i18n="fc_len"></span>
      <div class="seg" data-k="fc"><button data-v="3" data-i18n="fc_3"></button><button data-v="2" data-i18n="fc_2"></button><button data-v="1" data-i18n="fc_1"></button></div>
    </div>
    <div class="setrow"><span class="lab" data-i18n="theme"></span>
      <div class="seg" data-k="theme"><button data-v="dusk" data-i18n="th_dusk"></button><button data-v="sand" data-i18n="th_sand"></button><button data-v="moon" data-i18n="th_moon"></button></div>
    </div>
    <div class="setrow"><span class="lab" data-i18n="touch"></span>
      <div class="seg" data-k="touch"><button data-v="auto" data-i18n="tc_auto"></button><button data-v="on" data-i18n="tc_on"></button><button data-v="off" data-i18n="tc_off"></button></div>
    </div>
    <div class="setrow"><span class="lab" data-i18n="tips_opt"></span><button id="swTips" class="switch" role="switch" aria-checked="true" data-i18n-aria="tips_opt"></button></div>
    <div class="setrow"><span class="lab" data-i18n="reset"></span><button id="resetBtn" class="btn danger slim" data-i18n="reset"></button></div>
  </div>
</div>

<!-- ============ About ============ -->
<div class="overlay" id="ovAbout" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="abT">
    <div class="mhead"><h2 id="abT" data-i18n="about_t"></h2><button class="closex" data-close aria-label="✕">✕</button></div>
    <p data-i18n="about_p"></p>
    <h3 data-i18n="about_ctrl"></h3>
    <ul class="ctrl">
      <li data-i18n="ctrl1"></li>
      <li data-i18n="ctrl2"></li>
      <li data-i18n="ctrl3"></li>
      <li data-i18n="ctrl4"></li>
    </ul>

  mem:{}, ok:false,
  init(){ try{ localStorage.setItem("_t1","1"); localStorage.removeItem("_t1"); this.ok=true; }catch(e){ this.ok=false; } },
  get(k,d){ try{ if(this.ok){ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); } }catch(e){} return (k in this.mem) ? this.mem[k] : d; },
  set(k,v){ try{ if(this.ok){ localStorage.setItem(k, JSON.stringify(v)); return; } }catch(e){} this.mem[k]=v; },
  del(k){ try{ if(this.ok){ localStorage.removeItem(k); return; } }catch(e){} delete this.mem[k]; }
};

  coast:  { id:"coast",   icon:"🪨", amp:0.7, rocks:5, bedrockN:4, spill:false,
            weights:{ N:.34, W:.27, S:.22, E:.17 }, start:[6,1], oasis:[6,8] },
  mnt:    { id:"mnt",     icon:"⛰️", amp:1.35, rocks:3, bedrockN:4, spill:true,
            weights:{ E:.30, W:.30, N:.25, S:.15 }, start:[6,1], oasis:[6,8] }
};
/* Seeded RNG (mulberry32) with persistable state — used for daily-seed runs. */
function makeRng(seed){
  let s=seed>>>0;
  const rng={
    next(){ s|=0; s=s+0x6D2B79F5|0; let x=Math.imul(s^s>>>15,1|s); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; },
    get state(){ return s; }, set state(v){ s=v>>>0; }
  };
  return rng;
}
function hashStr(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function dateStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayOfYear(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }

/* ================= 5. Web Audio — synth, wind bed, cues ================= */
const A = {
  ctx:null, master:null, bedG:null, bedF:null, noiseBuf:null,
  init(){
    if(this.ctx) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=S.sound?0.5:0;
      this.master.connect(this.ctx.destination);
      const len=Math.floor(this.ctx.sampleRate*2);
      this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=this.noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.startBed();
    }catch(e){ this.ctx=null; }
  },
  resume(){ if(this.ctx && this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); },
  setSound(on){ if(this.master) this.master.gain.setTargetAtTime(on?0.5:0, this.ctx.currentTime, .05); },
  startBed(){
    const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=520; f.Q.value=.9;
    const g=this.ctx.createGain(); g.gain.value=.0001;
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
    const lfo=this.ctx.createOscillator(); lfo.frequency.value=.17;
    const lg=this.ctx.createGain(); lg.gain.value=170;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    this.bedG=g; this.bedF=f;
  },
  bedBase(){ return .05*(S.fury==="gentle"?.6:S.fury==="violent"?1.5:1); },
  setBed(v,tc){ if(this.bedG) this.bedG.gain.setTargetAtTime(Math.max(.0001,v), this.ctx.currentTime, tc||.8); },
  windSwell(storm){
    if(!this.ctx) return;
    this.setBed(this.bedBase()*(storm?2.6:1.8),.4);
    setTimeout(()=>{ if(this.ctx) this.setBed(this.bedBase()); }, 1500);
  },
  stormRoar(){
    if(!this.ctx) return;
    this.noise(2.4,{ freq:340, vol:.5, sweepTo:130 });
    this.setBed(.16,.3);
    setTimeout(()=>{ if(this.ctx) this.setBed(this.bedBase()); }, 2800);
  },
  tone(f,dur,type,vol,when,slideTo){
    if(!this.ctx || !S.sound) return;
    const t0=this.ctx.currentTime+(when||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||"sine";
    o.frequency.setValueAtTime(Math.max(30,f),t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol||.2,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+.06);
  },
  noise(dur,opt){
    if(!this.ctx || !S.sound) return;
    const o=opt||{}, t0=this.ctx.currentTime+(o.when||0);
    const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
    src.loopStart=Math.random(); src.loopEnd=2;
    const f=this.ctx.createBiquadFilter(); f.type=o.type||"lowpass";
    f.frequency.setValueAtTime(o.freq||800,t0); f.Q.value=o.q||1;
    if(o.sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40,o.sweepTo),t0+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(o.vol||.25,t0+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0+dur+.06);
  },
  grainTicks(n){
    for(let i=0;i<n;i++) this.noise(.03,{ type:"highpass", freq:2400+Math.random()*2200, vol:.07, when:i*.05 });
  },
  ui(){ this.tone(880,.06,"triangle",.1); },
  deny(){ this.tone(160,.12,"square",.11); },
  raise(){ this.noise(.12,{ type:"highpass", freq:1600, vol:.14 }); this.tone(520,.1,"triangle",.1); this.grainTicks(3); },
  dig(){ this.tone(120,.16,"sine",.3,0,55); this.noise(.14,{ freq:680, vol:.22 }); },
  tamp(){ this.tone(190,.09,"sine",.28,0,120); this.noise(.05,{ freq:1200, vol:.12 }); },
  rock(){ this.tone(70,.22,"sine",.34,0,40); this.noise(.08,{ type:"highpass", freq:3000, vol:.2 }); },
  step(){ this.tone(240,.1,"sine",.14,0,190); this.grainTicks(2); },
  dew(){ this.tone(740,.25,"sine",.13); this.tone(988,.3,"sine",.11,.12); },
  campOk(){ this.tone(392,.14,"triangle",.13); this.tone(523,.18,"triangle",.11,.1); },
  alarm(){ this.tone(220,.18,"square",.1); this.tone(180,.24,"square",.1,.18); },
  cache(){ [660,830,990,1320].forEach((f,i)=> this.tone(f,.3,"triangle",.13,i*.09)); },
  win(){ [523,659,784,1046,784,1046].forEach((f,i)=> this.tone(f,.35,"triangle",.15,i*.13)); },
  lose(){ [330,262,220,165].forEach((f,i)=> this.tone(f,.5,"sine",.15,i*.22)); }
};
/* ================= 6. Run state / world generation ================= */
let G=null;                       // current run (or null on route screen)
const CUR={ r:6, c:1 };           // cursor cell
const TOOLS=["raise","dig","tamp"];
let toolI=0;

function pickWind(weights,u){
  let acc=0;
  for(const d of ["N","E","S","W"]){ acc+=weights[d]; if(u<acc) return d; }
  return "W";
}
function ensureWind(n){ while(G.windSeq.length<n) G.windSeq.push(pickWind(G.route.weights, G.rng.next())); }
function windAt(d){ ensureWind(d+1); return G.windSeq[d-1]; }
function stormInterval(d){ return d<=12 ? 4 : (d<=20 ? 3 : 2); }
function isStormDay(d){ return d % stormInterval(d) === 0; }
function actionsPerDay(){ return S.fury==="gentle" ? 4 : 3; }

function genWorld(route,rng){
  const grid=[];
  for(let i=0;i<CELLS;i++) grid.push({ h:0, tamp:false });
  const ph1=rng()*6.283, ph2=rng()*6.283, ph3=rng()*6.283;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=2 + route.amp*Math.sin(c*.55+ph1) + route.amp*.7*Math.sin(r*.85+ph2)
              + route.amp*.5*Math.sin((r+c)*.4+ph3) + (rng()*1.6-0.8);
    grid[idx(r,c)].h=clamp(Math.round(v),0,5);
  }
  const reserved=new Set();
  for(const [rr,cc] of [route.start, route.oasis])
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)
      if(inB(rr+dr,cc+dc)){ const i=idx(rr+dr,cc+dc); grid[i].h=Math.min(grid[i].h,1); reserved.add(i); }
  const rocks=new Set(), bedrock=new Set();
  const free=(i)=> !reserved.has(i) && !rocks.has(i) && !bedrock.has(i);
  let guard=0;
  while(rocks.size<route.rocks && guard++<600){
    const r=Math.floor(rng()*N), c=Math.floor(rng()*N), i=idx(r,c);
    if(!free(i)) continue;
    if(Math.abs(r-route.start[0])+Math.abs(c-route.start[1])<2) continue;
    rocks.add(i);
  }
  guard=0;
  while(bedrock.size<route.bedrockN && guard++<800){
    const r=Math.floor(rng()*N), c=Math.floor(rng()*N), i=idx(r,c);
    if(!free(i)) continue;
    if(Math.abs(r-route.start[0])+Math.abs(c-route.start[1])<3) continue;
    bedrock.add(i);
  }
  let cacheI=-1; guard=0;
  while(cacheI<0 && guard++<900){
    const r=Math.floor(rng()*N), c=Math.floor(rng()*N), i=idx(r,c);
    if(!free(i) || grid[i].h<1) continue;
    const ds=Math.abs(r-route.start[0])+Math.abs(c-route.start[1]);
    const doo=Math.abs(r-route.oasis[0])+Math.abs(c-route.oasis[1]);
    if(ds>= (guard>600?3:5) && doo>=3){ cacheI=i; }
  }
  return { grid, rocks, bedrock, cacheI };
}

function newRun(routeKey, seed, daily){
  const R=ROUTES[routeKey];
  const sd=(seed===undefined) ? (Math.random()*0x7fffffff)>>>0 : seed>>>0;
  const rng=makeRng(sd);
  const world=genWorld(R,rng);
  G={
    routeKey, route:R, seed:sd, daily:!!daily, rng,
    grid:world.grid, rocks:world.rocks, bedrock:world.bedrock,
    cacheI:world.cacheI, cacheFound:false,
    oasisI:idx(R.oasis[0],R.oasis[1]),
    caravan:{ r:R.start[0], c:R.start[1] },
    day:1, water:12, actions:actionsPerDay(),
    fresh:new Set(), windSeq:[],
    phase:"day", over:false, endless:false, endlessStart:0, endlessBase:0, endlessDays:0,
    storms:0, hintDay:0,
    runStats:{ acts:0, dew:0, caches:0 }
  };
  CUR.r=R.start[0]; CUR.c=R.start[1];
  toolI=0; refreshToolbar();
  ST.runs++; saveStats();
  ensureWind(4);
  setParticlesWind(windAt(1), isStormDay(1));
  showScreen("game");
  sizeCanvases(); drawTerrain(); renderForecast(); updateHUD();
  toast(t("start_run"));
}

function saveRun(){
  if(!G || G.over) return;
  store.set("winds_resume",{
    routeKey:G.routeKey, seed:G.seed, daily:G.daily, rs:G.rng.state,
    grid:G.grid.map(c=>[c.h, c.tamp?1:0]),
    rocks:[...G.rocks], bedrock:[...G.bedrock],
    cacheI:G.cacheI, cacheFound:G.cacheFound,
    caravan:[G.caravan.r,G.caravan.c],
    day:G.day, water:G.water, actions:G.actions,
    fresh:[...G.fresh], windSeq:G.windSeq.slice(0, G.day+4),
    endless:G.endless, endlessStart:G.endlessStart, endlessBase:G.endlessBase, endlessDays:G.endlessDays,
    storms:G.storms, hintDay:G.hintDay,
    runStats:G.runStats
  });
}
function restoreRun(o){
  const R=ROUTES[o.routeKey];
  const rng=makeRng(o.seed); rng.state=o.rs;
  G={
    routeKey:o.routeKey, route:R, seed:o.seed, daily:!!o.daily, rng,
    grid:o.grid.map(([h,tp])=>({ h, tamp:!!tp })),
    rocks:new Set(o.rocks), bedrock:new Set(o.bedrock),
    cacheI:o.cacheI, cacheFound:o.cacheFound,
    oasisI:idx(R.oasis[0],R.oasis[1]),
    caravan:{ r:o.caravan[0], c:o.caravan[1] },
    day:o.day, water:o.water, actions:o.actions,
    fresh:new Set(o.fresh), windSeq:o.windSeq.slice(),
    phase:"day", over:false,
    endless:!!o.endless, endlessStart:o.endlessStart||0, endlessBase:o.endlessBase||0, endlessDays:o.endlessDays||0,
    storms:o.storms||0, hintDay:o.hintDay||0,
    runStats:o.runStats||{ acts:0, dew:0, caches:0 }
  };
  CUR.r=G.caravan.r; CUR.c=G.caravan.c;
  showScreen("game");
  sizeCanvases(); drawTerrain(); renderForecast(); updateHUD();
  setParticlesWind(windAt(G.day), isStormDay(G.day));
}
function clearResume(){ store.set("winds_resume", null); }

/* ================= 7. Shelter / caravan route logic ================= */
function shelterAt(r,c,dir){
  const [dr,dc]=VEC[dir];
  let s=0;
  for(let i=1;i<=2;i++){
    const rr=r-dr*i, cc=c-dc*i;
    if(!inB(rr,cc)) break;
    const ii=idx(rr,cc);
    s += G.rocks.has(ii) ? 5 : G.grid[ii].h;
  }
  return s;
}
function nextCamp(){
  const {r,c}=G.caravan, dir=windAt(G.day);
  const cands=[];
  for(const [dr,dc] of [[0,1],[1,0],[-1,0],[0,-1]]){
    const rr=r+dr, cc=c+dc;
    if(!inB(rr,cc)) continue;
    const ii=idx(rr,cc);
    if(G.rocks.has(ii)) continue;
    cands.push({
      rr, cc,
      dist:Math.abs(rr-G.route.oasis[0])+Math.abs(cc-G.route.oasis[1]),
      h:G.grid[ii].h,
      sh:shelterAt(rr,cc,dir)
    });
  }
  if(!cands.length) return null;
  cands.sort((a,b)=> a.dist-b.dist || a.h-b.h || b.sh-a.sh);
  return cands[0];
}
function shelterText(){
  const nc=nextCamp();
  if(!nc) return [t("blocked"),"risk"];
  const dir=windAt(G.day);
  const sh=shelterAt(nc.rr,nc.cc,dir);
  const safe=G.grid[idx(nc.rr,nc.cc)].tamp || sh>=3;
  return [
    t("camp_plan")+": "+(safe?t("sheltered"):t("exposed"))+" · "+t("shelter_score")+" "+sh,
    safe?"safe":"risk"
  ];
}

/* ================= 8. Sand simulation (the three winds) ================= */
function blowTurn(storm){
  const dir=windAt(G.day);
  const [dr,dc]=VEC[dir];
  const src=G.grid.map(c=>c.h);
  let bonus=0;
  if(G.route.spill) bonus+=1;
  if(storm) bonus += (S.fury==="gentle"?0 : S.fury==="violent"?2 : 1);
  const delta=new Array(CELLS).fill(0);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const i=idx(r,c);
    if(G.rocks.has(i) || G.grid[i].tamp) continue;
    const h=src[i];
    if(h<=0) continue;
    const rr=r+dr, cc=c+dc;
    if(!inB(rr,cc)) continue;
    const ni=idx(rr,cc);
    if(G.rocks.has(ni) || ni===G.oasisI) continue;   // rock blocks and piles; oasis sheds nothing in
    let k=Math.max(0, Math.min(2, h-src[ni]) + bonus);
    k=Math.min(k,h);
    if(k>0){ delta[i]-=k; delta[ni]+=k; }
  }
  let shifts=0;
  if(storm) shifts = S.fury==="gentle"?4 : S.fury==="violent"?12 : 8;
  for(let n=0;n<shifts;n++){
    const i=Math.floor(G.rng.next()*CELLS);
    if(G.rocks.has(i) || i===G.oasisI) continue;
    const d=G.rng.next()<.5?-1:1;
    delta[i]=clamp(G.grid[i].h+delta[i]+d,0,5)-G.grid[i].h;
  }
  for(let i=0;i<CELLS;i++){
    if(delta[i]!==0){
      const cell=G.grid[i];
      const nh=clamp(cell.h+delta[i],0,5);
      if(nh!==cell.h){ cell.h=nh; G.fresh.add(i); }
    }
  }
  A.grainTicks(storm?6:3);
}

/* ================= 9. Tools ================= */
function applyTool(kind){
  if(!G || G.phase!=="day") return;
  if(G.actions<=0){ toast(t("no_acts"),"bad"); A.deny(); return; }
  const i=idx(CUR.r,CUR.c), cell=G.grid[i];
  if(G.rocks.has(i)){ toast(t("invalid_rock"),"bad"); A.deny(); return; }
  if(i===G.oasisI){ toast(t("invalid_oasis"),"bad"); A.deny(); return; }
  if(kind==="raise"){
    if(cell.h>=5){ toast(t("cap5")); A.deny(); return; }
    cell.h++; G.fresh.add(i);
    grainBurst(CUR.r,CUR.c,"up"); A.raise();
  }else if(kind==="dig"){
    if(cell.h<=0){ toast(t("floor0")); A.deny(); return; }
    cell.h--; G.fresh.add(i);
    if(cell.h===0){
      if(G.bedrock.has(i)){ G.rocks.add(i); toast(t("bedrock"),"bad"); A.rock(); }
      else if(i===G.cacheI && !G.cacheFound){
        G.cacheFound=true; G.water+=4; G.runStats.caches++; ST.caches++;
        unlock("ach2"); toast(t("cache_found"),"gold"); A.cache();
      }
    }else if(!G.cacheFound && G.hintDay!==G.day){
      const cr=Math.floor(G.cacheI/N), cc=G.cacheI%N;
      if(Math.abs(CUR.r-cr)+Math.abs(CUR.c-cc)<=2){ G.hintDay=G.day; toast(t("cache_hint"),"gold"); }
    }
    grainBurst(CUR.r,CUR.c,"down"); A.dig();
  }else if(kind==="tamp"){
    if(cell.tamp){ toast(t("tamped_already")); A.deny(); return; }
    cell.tamp=true;
    grainBurst(CUR.r,CUR.c,"ring"); A.tamp();
  }
  G.actions--; G.runStats.acts++; ST.acts++;
  if(G.runStats.acts>=50) unlock("ach4");
  drawTerrain(); updateHUD(); saveRun();
}

/* ================= 10. Day cycle: dusk → night wind → dawn ================= */
function endDay(){
  if(!G || G.phase!=="day") return;
  const nc=nextCamp();
  if(!nc){ toast(t("blocked"),"bad"); A.deny(); return; }
  G.phase="resolve"; updateHUD();
  toast(t("dusk_mv")); A.step();
  const from={ r:G.caravan.r, c:G.caravan.c };
  G.caravan={ r:nc.rr, c:nc.cc };
  grainBurst(from.r,from.c,"ring");
  updateHUD();
  if(nc.rr===G.route.oasis[0] && nc.cc===G.route.oasis[1]){
    setTimeout(winRun, 620);
    return;
  }
  const dir=windAt(G.day);
  const sh=shelterAt(G.caravan.r,G.caravan.c,dir);
  const tampSafe=G.grid[idx(G.caravan.r,G.caravan.c)].tamp;
  setTimeout(()=>{
    if(!tampSafe && sh<3){ G.water-=2; toast(t("exposed_hit"),"bad"); A.alarm(); }
    else { toast(t("camp_safe"),"good"); A.campOk(); }
    updateHUD();
    const storm=isStormDay(G.day);
    setParticlesWind(dir, storm);
    A.windSwell(storm);
    setTimeout(()=>{
      blowTurn(storm);
      drawTerrain();
      if(storm){ stormFx=1; toast(t("storm_now"),"bad"); A.stormRoar(); G.storms++; ST.storms++; }
      const ci=idx(G.caravan.r,G.caravan.c);
      if(G.grid[ci].h>=5){ loseRun("buried"); return; }
      setTimeout(dawnPhase, 720);
    }, storm?1150:750);
  }, 480);
}
function dawnPhase(){
  G.day++;
  let dew=0;
  for(const i of G.fresh){
    const r=Math.floor(i/N), c=i%N;
    if(Math.abs(r-G.caravan.r)+Math.abs(c-G.caravan.c)===1) dew++;
  }
  dew=Math.min(2,dew);
  G.fresh.clear();
  G.water-=1;
  if(dew>0){
    G.water+=dew; G.runStats.dew+=dew; ST.dew+=dew;
    unlock("ach1");
    toast(fmt(t("dew"),{n:dew}),"good"); A.dew();
  }
  if(G.endless){
    G.endlessDays++;
    if(G.endlessDays>=5) unlock("ach7");
    if(G.endlessDays>ST.endless) ST.endless=G.endlessDays;
  }
  if(G.storms>=2) unlock("ach3");
  saveStats();
  if(G.water<=0){ loseRun("thirst"); return; }
  G.actions=actionsPerDay();
  G.phase="day";
  ensureWind(G.day+4);
  setParticlesWind(windAt(G.day), isStormDay(G.day));
  renderForecast(); updateHUD(); saveRun();
}

/* ================= 11. Win / lose / endless ================= */
function finalScore(days){
  return Math.max(0,G.water)*10 + G.actions + Math.max(0,8-days)*5;
}
function winRun(){
  G.over=true;
  const score=finalScore(G.day);
  const bkey="winds_best_"+G.routeKey;
  const prev=store.get(bkey,0);
  const isBest=score>prev;
  if(isBest) store.set(bkey,score);
  if(!G.endless){ G.endlessBase=score; }
  ST.wins++; saveStats();
  unlock("ach5");
  if(G.routeKey==="mnt") unlock("ach6");
  if(ROUTE_ORDER.every(rk=>store.get("winds_best_"+rk,0)>0)) unlock("ach8");
  if(G.daily){
    const d=store.get("winds_daily",null);
    if(!d || d.d!==dateStr() || score>d.s) store.set("winds_daily",{ d:dateStr(), s:score });
  }
  clearResume();
  A.win();
  celebrate();
  showEndWin(score, prev, isBest);
}
function loseRun(cause){
  G.over=true;
  const days=G.day;
  if(G.endless && G.endlessDays>0){
    const fin=G.endlessBase + G.endlessDays*5;
    const ekey="winds_endless_"+G.routeKey;
    if(fin>store.get(ekey,0)) store.set(ekey,fin);
  }
  saveStats();
  clearResume();
  A.lose();
  showEndLose(cause, days);
}
function startEndless(){
  G.over=false;
  G.endless=true;
  G.endlessStart=G.day;
  G.endlessDays=0;
  G.phase="day";

const cv=document.getElementById("stage");
const cx=cv.getContext("2d");
const off=document.createElement("canvas");
const ox=off.getContext("2d");
let stormFx=0, DPR=1;

const CANVAS_THEMES={

         cur:"#cfe6f5", grain:"rgba(220,235,245,.5)", tent:"#a3c4da", tentDark:"#5a7d94" }
};
function CPAL(){ return CANVAS_THEMES[S.theme] || CANVAS_THEMES.dusk; }
function jitter(i){ return ((i*137+29)%89)/89; }

function sizeCanvases(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  cv.width=SZ*DPR; cv.height=SZ*DPR;
  off.width=SZ*DPR; off.height=SZ*DPR;
  cx.setTransform(DPR,0,0,DPR,0,0);
  ox.setTransform(DPR,0,0,DPR,0,0);
  if(G) drawTerrain();
}

function drawPalm(g,x,y,s){
  g.strokeStyle=CPAL().trunk; g.lineWidth=3*s;
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+3*s,y-9*s,x+1*s,y-16*s); g.stroke();
  g.strokeStyle=CPAL().palm; g.lineWidth=2.6*s; g.lineCap="round";
  const tx=x+1*s, ty=y-16*s;
  for(let k=0;k<5;k++){
    const a=-Math.PI*.9 + k*Math.PI*.45;
    g.beginPath(); g.moveTo(tx,ty);
    g.quadraticCurveTo(tx+Math.cos(a)*7*s, ty+Math.sin(a)*7*s, tx+Math.cos(a)*11*s, ty+Math.sin(a)*11*s+4*s);
    g.stroke();
  }
  g.lineCap="butt";
}

function drawTerrain(){
  const P=CPAL();
  ox.clearRect(0,0,SZ,SZ);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const i=idx(r,c), x=c*CELL, y=r*CELL, cell=G.grid[i];
    ox.fillStyle=P.sand[clamp(cell.h,0,5)];
    ox.fillRect(x,y,CELL,CELL);
    const j=jitter(i);
    ox.fillStyle=j<.5 ? "rgba(255,255,255,"+(j*.14).toFixed(3)+")" : "rgba(40,20,5,"+((j-.5)*.14).toFixed(3)+")";
    ox.fillRect(x,y,CELL,CELL);
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const i=idx(r,c), x=c*CELL, y=r*CELL;
    if(G.rocks.has(i)) continue;
    const h=G.grid[i].h;
    const hn=inB(r-1,c)?(G.rocks.has(idx(r-1,c))?6:G.grid[idx(r-1,c)].h):h;
    const hs=inB(r+1,c)?(G.rocks.has(idx(r+1,c))?6:G.grid[idx(r+1,c)].h):h;
    if(h>hn){ ox.fillStyle=P.crest; ox.fillRect(x,y,CELL,3); }
    if(h>hs){ ox.fillStyle=P.shade; ox.fillRect(x,y+CELL-3,CELL,3); }
  }
  for(let i=0;i<CELLS;i++){
    if(!G.grid[i].tamp || G.rocks.has(i)) continue;
    const x=(i%N)*CELL, y=Math.floor(i/N)*CELL;
    ox.fillStyle=P.tamp; ox.fillRect(x+2,y+2,CELL-4,CELL-4);
    ox.strokeStyle=P.tampLine; ox.lineWidth=1.4;
    ox.beginPath();
    for(let k=1;k<4;k++){ ox.moveTo(x+4,y+k*(CELL/4)); ox.lineTo(x+CELL-4,y+k*(CELL/4)-8); }
    ox.stroke();
    ox.strokeRect(x+3.5,y+3.5,CELL-7,CELL-7);
  }
  for(const i of G.rocks){
    const x=(i%N)*CELL, y=Math.floor(i/N)*CELL, j=jitter(i);
    const cxp=x+CELL/2, cyp=y+CELL/2;
    ox.fillStyle=P.sand[0]; ox.fillRect(x,y,CELL,CELL);
    ox.fillStyle="rgba(40,20,5,.18)"; ox.fillRect(x,y+CELL-6,CELL,6);
    const pts=[[.5,.16],[.84,.38],[.78,.82],[.24,.86],[.14,.44]];
    ox.fillStyle=P.rock1;
    ox.beginPath();
    pts.forEach(([px,py],k)=>{
      const wx=cxp+(px-.5)*CELL*(0.9+j*.2), wy=cyp+(py-.5)*CELL*(0.9+((j*7)%1)*.2);
      if(k===0) ox.moveTo(wx,wy); else ox.lineTo(wx,wy);
    });
    ox.closePath(); ox.fill();
    ox.strokeStyle=P.rock2; ox.lineWidth=2; ox.stroke();
    ox.fillStyle=P.rock2;
    ox.beginPath(); ox.arc(cxp-7+j*4, cyp-4, 2, 0, 7); ox.fill();
    ox.beginPath(); ox.arc(cxp+6-j*3, cyp+7, 1.6, 0, 7); ox.fill();
  }
  ox.strokeStyle=P.grid; ox.lineWidth=1;
  ox.beginPath();
  for(let k=0;k<=N;k++){
    ox.moveTo(k*CELL,0); ox.lineTo(k*CELL,SZ);
    ox.moveTo(0,k*CELL); ox.lineTo(SZ,k*CELL);
  }
  ox.stroke();
  const orr=G.route.oasis, oX=orr[1]*CELL, oY=orr[0]*CELL;
  ox.fillStyle=P.water;
  ox.beginPath(); ox.ellipse(oX+CELL/2, oY+CELL/2+3, 21, 13, 0, 0, 7); ox.fill();
  ox.strokeStyle=P.waterHi; ox.lineWidth=2;
  ox.beginPath(); ox.ellipse(oX+CELL/2, oY+CELL/2+3, 21, 13, 0, 0, 7); ox.stroke();
  drawPalm(ox, oX+14, oY+20, .9);
  drawPalm(ox, oX+CELL-12, oY+16, 1.05);
  ox.strokeStyle=P.palm; ox.lineWidth=1.6; ox.globalAlpha=.55;
  for(let k=0;k<4;k++){
    const gx=oX+CELL+8+((k*23)%34), gy=oY+10+((k*31)%40);
    ox.beginPath(); ox.arc(gx,gy,3.4,Math.PI,0); ox.stroke();
  }
  ox.globalAlpha=1;
  const sx=G.route.start, sX=sx[1]*CELL, sY=sx[0]*CELL;
  ox.strokeStyle=P.waterHi; ox.lineWidth=2;
  ox.beginPath(); ox.moveTo(sX+12,sY+44); ox.lineTo(sX+12,sY+16); ox.stroke();
  ox.fillStyle=P.waterHi;
  ox.beginPath(); ox.moveTo(sX+12,sY+16); ox.lineTo(sX+30,sY+22); ox.lineTo(sX+12,sY+28); ox.closePath(); ox.fill();
  if(G.cacheFound && G.cacheI>=0){
    const x=(G.cacheI%N)*CELL, y=Math.floor(G.cacheI/N)*CELL;
    ox.fillStyle=P.tentDark;
    ox.beginPath(); ox.ellipse(x+CELL/2, y+CELL-14, 9, 7, 0, 0, 7); ox.fill();
    ox.fillRect(x+CELL/2-4, y+CELL-24, 8, 9);
    ox.fillStyle=P.cur;
    ox.beginPath(); ox.ellipse(x+CELL/2, y+CELL-14, 4, 2.6, 0, 0, 7); ox.fill();
  }
}

/* ================= 13. Particles (input-reactive grains) ================= */
const PARTS=[];
let windVec={ x:1, y:0 }, windPow=1;
function effMotion(){ return S.motion && !REDUCED; }
function setParticlesWind(dir,storm){
  const [dr,dc]=VEC[dir];
  windVec={ x:dc, y:dr };
  windPow=(storm?3:1)*(S.fury==="violent"?1.6:S.fury==="gentle"?.7:1);
}
function spawnGrains(n,storm){
  for(let k=0;k<n;k++){
    if(PARTS.length>260) PARTS.shift();
    const sp=(30+Math.random()*55)*windPow;
    PARTS.push({
      x:Math.random()*SZ, y:Math.random()*SZ,
      vx:windVec.x*sp+(Math.random()-.5)*12, vy:windVec.y*sp+(Math.random()-.5)*12,
      ph:Math.random()*7, life:0, ttl:1.6+Math.random()*2.2, s:1+Math.random()*2.2, kind:0
    });
  }
}
function grainBurst(r,c,kind){
  if(!effMotion() || !G) return;
  const x=c*CELL+CELL/2, y=r*CELL+CELL/2;
  for(let k=0;k<12;k++){
    if(PARTS.length>260) PARTS.shift();
    let vx,vy;
    if(kind==="up"){ vx=(Math.random()-.5)*40; vy=-30-Math.random()*50; }
    else if(kind==="down"){ vx=(Math.random()-.5)*50; vy=20+Math.random()*40; }
    else { const a=Math.random()*7, sp=40+Math.random()*50; vx=Math.cos(a)*sp; vy=Math.sin(a)*sp*.6; }
    PARTS.push({ x:x+(Math.random()-.5)*24, y:y+(Math.random()-.5)*16, vx, vy, ph:Math.random()*7, life:0, ttl:.7+Math.random()*.6, s:1.4+Math.random()*1.8, kind:1 });
  }
}
function celebrate(){
  if(!G) return;
  const x=G.route.oasis[1]*CELL+CELL/2, y=G.route.oasis[0]*CELL+CELL/2;
  for(let k=0;k<70;k++){
    const a=-Math.PI/2+(Math.random()-.5)*2.2, sp=90+Math.random()*160;
    PARTS.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, ph:Math.random()*7, life:0, ttl:1.2+Math.random()*1.2, s:2+Math.random()*2.4, kind:2 });
  }
}
function updateParticles(dt){
  if(effMotion()) spawnGrains(isStormDay(G?G.day:1)&&G?3:2, false);
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i];
    p.life+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.x+=Math.sin(p.life*6+p.ph)*9*dt;
    if(p.life>p.ttl || p.x<-4 || p.x>SZ+4 || p.y<-4 || p.y>SZ+4) PARTS.splice(i,1);
  }
}
function drawParticles(){
  if(!PARTS.length) return;
  const P=CPAL();
  for(const p of PARTS){
    const a=Math.max(0,1-p.life/p.ttl);
    if(p.kind===2){
      cx.fillStyle=["#e0b083","#9cc98a","#e6b455","#8fc1d4"][Math.floor(p.ph*4)%4];
      cx.globalAlpha=a;
    }else{
      cx.fillStyle=p.kind===1?P.cur:P.grain;
      cx.globalAlpha=a*.9;
    }
    cx.fillRect(p.x,p.y,p.s,p.s);
  }
  cx.globalAlpha=1;
}

let boardDirty=true, lastSnap="";
function stateChanged(){
  let hs="";
  for(let i=0;i<CELLS;i++) hs+=String.fromCharCode(48+G.grid[i].h+(G.grid[i].tamp?7:0));
  const snap=[G.day,G.phase,G.water,G.actions,G.caravan.r,G.caravan.c,
              G.cacheFound,CUR.r,CUR.c,S.theme,toolI,hs].join("|");

function windArrow(g,x,y,dr,dc,len){
  g.beginPath();
  g.moveTo(x-dc*len, y-dr*len);
  g.lineTo(x+dc*len, y+dr*len);
  g.stroke();
  const hx=x+dc*len, hy=y+dr*len;
  g.beginPath();
  g.moveTo(hx-dc*7-dr*5, hy-dr*7+dc*5);
  g.lineTo(hx,hy);
  g.lineTo(hx-dc*7+dr*5, hy-dr*7-dc*5);
  g.stroke();
}
function drawBoard(){
  if(!G) return;
  const P=CPAL();
  cx.clearRect(0,0,SZ,SZ);
  cx.drawImage(off,0,0,SZ,SZ);   /* cached static terrain layer */
  /* buried cache: subtle mound hint until it is dug up */
  if(!G.cacheFound && G.cacheI>=0 && !G.rocks.has(G.cacheI)){
    const bx=(G.cacheI%N)*CELL, by=Math.floor(G.cacheI/N)*CELL;
    cx.fillStyle=P.crest;
    cx.beginPath(); cx.ellipse(bx+CELL/2,by+CELL/2+4,17,8,0,0,7); cx.fill();
    cx.fillStyle=P.shade;
    cx.beginPath(); cx.ellipse(bx+CELL/2,by+CELL/2+9,13,5,0,0,7); cx.fill();
  }
  /* next camp: shelter glow — safe green / exposed red (reuses nextCamp + shelterAt) */
  if(G.phase==="day"){
    const nc=nextCamp();
    if(nc){
      const gx=nc.cc*CELL, gy=nc.rr*CELL;
      const safe=G.grid[idx(nc.rr,nc.cc)].tamp || nc.sh>=3;
      cx.fillStyle= safe? "rgba(156,201,138,.17)" : "rgba(224,122,95,.15)";
      cx.fillRect(gx+1,gy+1,CELL-2,CELL-2);
      cx.strokeStyle= safe? "rgba(156,201,138,.85)" : "rgba(224,122,95,.85)";
      cx.lineWidth=2; cx.setLineDash([5,4]);
      cx.strokeRect(gx+2.5,gy+2.5,CELL-5,CELL-5);
      cx.setLineDash([]);
    }
  }
  /* caravan: tent + banner */
  const kx=G.caravan.c*CELL, ky=G.caravan.r*CELL;
  cx.fillStyle="rgba(25,12,4,.3)";
  cx.beginPath(); cx.ellipse(kx+CELL/2,ky+CELL-10,16,5.5,0,0,7); cx.fill();
  cx.fillStyle=P.tentDark;
  cx.beginPath();
  cx.moveTo(kx+CELL/2,ky+13); cx.lineTo(kx+CELL-10,ky+CELL-12); cx.lineTo(kx+10,ky+CELL-12);
  cx.closePath(); cx.fill();
  cx.fillStyle=P.tent;
  cx.beginPath();
  cx.moveTo(kx+CELL/2,ky+15); cx.lineTo(kx+CELL/2+7,ky+CELL-12); cx.lineTo(kx+CELL/2-7,ky+CELL-12);
  cx.closePath(); cx.fill();
  cx.strokeStyle=P.tentDark; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(kx+CELL/2,ky+13); cx.lineTo(kx+CELL/2,ky+2); cx.stroke();
  cx.fillStyle=P.waterHi;
  cx.beginPath();
  cx.moveTo(kx+CELL/2,ky+2); cx.lineTo(kx+CELL/2+11,ky+6); cx.lineTo(kx+CELL/2,ky+10);
  cx.closePath(); cx.fill();
  /* cursor ring — breathes only when motion is allowed */
  const qx=CUR.c*CELL, qy=CUR.r*CELL;
  const pu=effMotion()? (Math.sin(performance.now()/280)*.5+.5) : .6;
  cx.globalAlpha=.5+.4*pu;
  cx.strokeStyle=P.cur; cx.lineWidth=3;
  cx.strokeRect(qx+3,qy+3,CELL-6,CELL-6);
  cx.globalAlpha=1;
  /* wind-direction indicator + forecast chips for the next days */
  drawWindPanel(P);
  boardDirty=false;
}
function drawWindPanel(P){
  const bs=46, bx=10, by=10;
  const dir=windAt(G.day), storm=isStormDay(G.day);
  const [dr,dc]=VEC[dir];
  cx.fillStyle="rgba(20,10,6,.55)";
  cx.fillRect(bx,by,bs,bs);
  cx.strokeStyle=P.waterHi; cx.lineWidth=1.5;
  cx.strokeRect(bx+.5,by+.5,bs-1,bs-1);
  cx.strokeStyle= storm? "rgba(255,205,130,.95)" : P.cur;
  cx.lineWidth=3; cx.lineCap="round";
  windArrow(cx, bx+bs/2, by+bs/2-6, dr, dc, 13);
  cx.lineCap="butt";
  cx.fillStyle=P.cur;
  cx.font="700 10px Tahoma, sans-serif";
  cx.textAlign="center"; cx.textBaseline="middle";
  cx.fillText(t(dir), bx+bs/2, by+bs-7);
  /* small chips: one per forecast day after today */
  const len=clamp(S.fc|0,1,3);
  let cxp=bx+bs+6;
  for(let d=1; d<=len; d++){
    const dd=windAt(G.day+d), st=isStormDay(G.day+d);
    const [r2,c2]=VEC[dd], s=30;
    cx.fillStyle= st? "rgba(120,26,18,.6)" : "rgba(20,10,6,.45)";
    cx.fillRect(cxp,by,s,s);
    cx.strokeStyle= st? "rgba(255,205,130,.8)" : "rgba(255,255,255,.3)";
    cx.lineWidth=1;
    cx.strokeRect(cxp+.5,by+.5,s-1,s-1);
    cx.strokeStyle=P.cur;
    cx.lineWidth=2; cx.lineCap="round";
    windArrow(cx, cxp+s/2, by+s/2, r2, c2, 8);
    cx.lineCap="butt";
    if(st){
      cx.strokeStyle="rgba(255,205,130,.95)"; cx.lineWidth=1.5;
      cx.beginPath();
      cx.moveTo(cxp+4,by+s-5); cx.lineTo(cxp+9,by+s-11);
      cx.moveTo(cxp+9,by+s-4); cx.lineTo(cxp+14,by+s-10);
      cx.stroke();
    }
    cx.fillStyle="rgba(255,255,255,.85)";
    cx.font="700 9px Tahoma, sans-serif";
    cx.textAlign="left"; cx.textBaseline="top";
    cx.fillText(String(G.day+d), cxp+2.5, by+1.5);
    cxp+=s+5;
  }
  cx.textAlign="start"; cx.textBaseline="alphabetic";
}
/* == 15 end == */

/* ================= 16. Input wiring (pointer + keyboard + delegated clicks) ================= */
function cellFromEvent(e){
  const rect=cv.getBoundingClientRect();
  if(!rect.width || !rect.height) return null;
  const x=(e.clientX-rect.left)*(SZ/rect.width);
  const y=(e.clientY-rect.top)*(SZ/rect.height);
  const c=Math.floor(x/CELL), r=Math.floor(y/CELL);
  return inB(r,c)? {r,c} : null;
}
function moveCursor(dr,dc){
  if(!G) return;
  const nr=clamp(CUR.r+dr,0,N-1), ncc=clamp(CUR.c+dc,0,N-1);
  if(nr!==CUR.r || ncc!==CUR.c){ CUR.r=nr; CUR.c=ncc; A.ui(); }
}
function cycleTool(){
  toolI=(toolI+1)%TOOLS.length;
  refreshToolbar(); A.ui();
}
function bindUI(){
  /* pointer on the stage: tap = move cursor + apply current tool; drag = move cursor only */
  cv.addEventListener("pointerdown", e=>{
    A.init(); A.resume();
    if(!G || G.over || openedOv) return;
    const p=cellFromEvent(e);
    if(!p) return;
    CUR.r=p.r; CUR.c=p.c;
    applyTool(TOOLS[toolI]);
    e.preventDefault();
  });
  cv.addEventListener("pointermove", e=>{
    if(!G || G.over || openedOv) return;
    const p=cellFromEvent(e);
    if(p && (p.r!==CUR.r || p.c!==CUR.c)){ CUR.r=p.r; CUR.c=p.c; }
  });
  /* keyboard: arrows cursor · Z/X/C tools · Tab cycle · Enter apply · Space end day · Esc close */
  window.addEventListener("keydown", e=>{
    if(e.key==="Escape"){
      if(openedOv){ closeOv(); confirmFn=null; e.preventDefault(); }
      return;
    }
    if(!G || G.over || openedOv || document.getElementById("gameScreen").hidden) return;
    const mv={ ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] };
    if(mv[e.key]){ e.preventDefault(); moveCursor(mv[e.key][0], mv[e.key][1]); return; }
    const code=(e.code||"").toLowerCase(), key=(e.key||"").toLowerCase();
    let toolAct=null;
    if(code==="keyz"||key==="z") toolAct="raise";
    else if(code==="keyx"||key==="x") toolAct="dig";
    else if(code==="keyc"||key==="c") toolAct="tamp";
    if(toolAct){
      e.preventDefault();
      toolI=TOOLS.indexOf(toolAct);
      refreshToolbar();
      applyTool(toolAct);
      return;
    }
    if(e.key==="Tab"){ e.preventDefault(); cycleTool(); return; }
    if(e.key==="Enter"){ e.preventDefault(); applyTool(TOOLS[toolI]); return; }
    if(e.key===" "){ e.preventDefault(); A.init(); if(G.phase==="day") endDay(); }
  });
  /* touch dpad */
  document.getElementById("dpad").addEventListener("click", e=>{
    const b=e.target.closest("button[data-act]");
    if(!b || !G || G.over || openedOv) return;
    A.init(); A.resume();
    const a=b.dataset.act;
    if(a==="up") moveCursor(-1,0);
    else if(a==="down") moveCursor(1,0);
    else if(a==="left") moveCursor(0,-1);
    else if(a==="right") moveCursor(0,1);
    else applyTool(TOOLS[toolI]);
  });
  /* end-screen buttons (rebuilt per run, so delegated) */
  document.getElementById("endBtns").addEventListener("click", e=>{
    const b=e.target.closest("button[data-act]");
    if(!b || !G) return;
    A.ui();
    const a=b.dataset.act;
    if(a==="again" || a==="retry"){ closeOv(); newRun(G.routeKey); }
    else if(a==="endless") startEndless();
    else if(a==="routes"){ closeOv(); showScreen("routes"); }
  });
  /* one delegated click handler for every static button */
  document.addEventListener("click", e=>{
    const tgt=(e.target instanceof Element)? e.target : null;
    if(!tgt) return;
    if(tgt.closest("[data-close]")){ confirmFn=null; closeOv(); A.ui(); return; }
    const hit=(sel)=>tgt.closest("#"+sel);
    if(hit("btnLang")){ LANG=(LANG==="ar")?"en":"ar"; store.set("winds_lang",LANG); applyLang(); toast(t("lang_done")); A.ui(); return; }
    if(hit("btnRecords")){ fillRecords(); openOv("ovRecords"); A.ui(); return; }
    if(hit("btnAbout")){ openOv("ovAbout"); A.ui(); return; }
    if(hit("btnSettings")){ syncSettingsUI(); openOv("ovSettings"); A.ui(); return; }
    if(hit("onboardOk")){ store.set("winds_onb",true); closeOv(); A.init(); A.resume(); A.ui(); return; }
    if(hit("replayBtn")){ openOv("ovOnboard"); A.ui(); return; }
    if(hit("keysBtn")){ openOv("ovKeys"); A.ui(); return; }
    const card=tgt.closest("#routeGrid [data-act]");
    if(card){
      A.init(); A.resume(); A.ui();
      const act=card.dataset.act;
      if(act==="route") newRun(card.dataset.rk);
      else if(act==="daily") newRun(ROUTE_ORDER[dayOfYear()%ROUTE_ORDER.length], hashStr("three-winds/"+dateStr()), true);
      else if(act==="resume"){
        const o=store.get("winds_resume",null);
        if(o && ROUTES[o.routeKey]) restoreRun(o);
        else buildRouteGrid();
      }
      return;
    }
    const tb=tgt.closest("#toolRow .toolbtn");
    if(tb){ toolI=clamp(parseInt(tb.dataset.i,10)||0,0,TOOLS.length-1); refreshToolbar(); A.ui(); return; }
    if(hit("swSound")){ S.sound=!S.sound; saveSettings(); syncSettingsUI(); A.init(); A.setSound(S.sound); A.ui(); return; }
    if(hit("swMotion")){ S.motion=!S.motion; saveSettings(); syncSettingsUI(); if(!S.motion) PARTS.length=0; A.ui(); return; }
    if(hit("swTips")){ S.tips=!S.tips; saveSettings(); syncSettingsUI(); rotateTip(); A.ui(); return; }
    const segb=tgt.closest(".seg[data-k] button[data-v]");
    if(segb){ setSetting(segb.closest(".seg").dataset.k, segb.dataset.v); return; }
    if(hit("resetBtn")){ confirmAsk(t("reset_c_t"), t("reset_c_b"), t("yes"), resetAll); return; }
    if(hit("cfY")){ const fn=confirmFn; confirmFn=null; closeOv(); if(fn) fn(); return; }
    if(hit("cfN")){ confirmFn=null; closeOv(); A.ui(); return; }
    if(hit("endDayBtn")){ A.init(); A.resume(); if(G && G.phase==="day" && !G.over) endDay(); return; }
    if(hit("quitBtn")){
      A.ui();
      if(!G || G.over) return;
      if(G.phase!=="day"){ A.deny(); return; }
      confirmAsk(t("quit"), t("quit_b"), t("quit_yes"), ()=>{ clearResume(); closeOv(); showScreen("routes"); });
    }
  });
}

/* ================= 17. End-state fill (win / lose) ================= */
function endRow(lbl,val,cls){
  const r=el("div","erow"+(cls?" "+cls:""));
  r.appendChild(el("span",null,lbl));
  r.appendChild(el("b",null,String(val)));
  return r;
}
function endBtn(label,act,cls){
  const b=el("button","btn"+(cls?" "+cls:""),label);
  b.type="button"; b.dataset.act=act;
  b.setAttribute("aria-label",label);
  return b;
}
function showEndWin(score,prev,isBest){
  document.getElementById("endArt").textContent="🌴 ✨ 🐪";
  document.getElementById("endT").textContent=t("win_t");
  document.getElementById("endS").textContent=t("win_s");
  const nb=document.getElementById("endNew");
  nb.innerHTML="";
  if(isBest) nb.appendChild(el("span","newbest","🎉 "+t("new_best")));
  else if(prev>0) nb.appendChild(el("span","sub",t("prev_best")+": "+prev));
  const rows=document.getElementById("endRows");
  rows.innerHTML="";
  rows.appendChild(endRow(t("score"),score,"score"));
  rows.appendChild(endRow(t("days_used"),G.day));
  rows.appendChild(endRow(t("water_left"),Math.max(0,G.water)));
  rows.appendChild(endRow(t("acts_left"),G.actions));
  const bt=document.getElementById("endBtns");
  bt.innerHTML="";
  bt.appendChild(endBtn(t("again"),"again","primary"));
  bt.appendChild(endBtn(t("endless_btn"),"endless"));
  bt.appendChild(endBtn(t("to_routes"),"routes"));
  openOv("ovEnd");
}
function showEndLose(cause,days){
  document.getElementById("endArt").textContent=(cause==="buried")? "🏜️ ⛺ 💀" : "🏜️ 🐪 💀";
  document.getElementById("endT").textContent=t("lose_t");
  document.getElementById("endS").textContent=t(cause==="buried"?"lose_buried":"lose_thirst");
  const nb=document.getElementById("endNew");
  nb.innerHTML="";
  nb.appendChild(el("span","sub",fmt(t("lost_days"),{n:days})));
  const rows=document.getElementById("endRows");
  rows.innerHTML="";
  rows.appendChild(endRow(t("days_used"),days));
  const bt=document.getElementById("endBtns");
  bt.innerHTML="";
  bt.appendChild(endBtn(t("retry"),"retry","primary"));
  bt.appendChild(endBtn(t("to_routes"),"routes"));
  openOv("ovEnd");
}

/* ================= 18. Records panel: route bests + lifetime + achievements ================= */
function fillRecords(){
  const body=document.getElementById("recBody");
  if(!body) return;
  body.innerHTML="";
  body.appendChild(el("h3",null,t("rec_bests")));
  for(const rk of ROUTE_ORDER){
    const row=el("div","brow");
    row.appendChild(el("span",null,ROUTES[rk].icon+" "+t("route_"+rk)));
    row.appendChild(el("b",null,bestText("winds_best_"+rk)));
    body.appendChild(row);
  }
  const d=store.get("winds_daily",null);
  const drow=el("div","brow");
  drow.appendChild(el("span",null,"🗓️ "+t("daily_row")+(d? " · "+d.d : "")));
  drow.appendChild(el("b",null,(d && d.s>0)? String(d.s) : t("no_best")));
  body.appendChild(drow);
  const erow=el("div","brow");
  erow.appendChild(el("span",null,"♾️ "+t("endless_best")));
  erow.appendChild(el("b",null,(ST.endless>0)? String(ST.endless) : t("no_best")));
  body.appendChild(erow);
  body.appendChild(el("h3",null,t("rec_stats")));
  const stats=[["st_runs",ST.runs],["st_wins",ST.wins],["st_caches",ST.caches],
               ["st_storms",ST.storms],["st_dew",ST.dew],["st_acts",ST.acts],["st_endless",ST.endless]];
  for(const [k,v] of stats){
    const row=el("div","brow");
    row.appendChild(el("span",null,t(k)));
    row.appendChild(el("b",null,String(v)));
    body.appendChild(row);
  }
  body.appendChild(el("h3",null,t("rec_ach")));
  const grid=el("div","achgrid");
  for(const a of ACH_LIST){
    const got=!!ACH[a.id];
    const c=el("div","ach"+(got?" got":""));
    c.appendChild(el("span","ic",got? a.icon : "🔒"));
    c.appendChild(el("b",null,t(a.id)));
    c.appendChild(el("span",null,t(a.id+"_d")));
    c.setAttribute("aria-label", t(a.id)+(got? "" : " — "+t("ach_locked")));
    grid.appendChild(c);
  }
  body.appendChild(grid);
}

/* ================= 19. Main loop (rAF, dt clamp, pauses when hidden) + init ================= */
let lastTs=0, rafId=0, loopOn=false, tipAcc=11;
function frame(ts){
  rafId=0;
  if(!loopOn) return;
  const dt=Math.min(.05, Math.max(.001,(ts-lastTs)/1000));
  lastTs=ts;
  if(G){
    updateParticles(dt);
    if(stormFx>0) stormFx=Math.max(0,stormFx-dt*.7);
    if(boardDirty || stateChanged() || PARTS.length || stormFx>0 || (effMotion() && !G.over)) drawBoard();
    drawParticles();
  }else if(lastSnap){ lastSnap=""; boardDirty=true; }
  tipAcc+=dt;
  if(tipAcc>=12){ tipAcc=0; rotateTip(); }
  rafId=requestAnimationFrame(frame);
}
function startLoop(){
  if(loopOn) return;
  loopOn=true; lastTs=performance.now();
  if(!rafId) rafId=requestAnimationFrame(frame);
}
function stopLoop(){
  loopOn=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopLoop(); else startLoop(); });

function initGame(){
  LANG = (store.get("winds_lang","ar")==="en")? "en" : "ar";
  buildRouteGrid();
  buildDpad();
  syncSettingsUI();
  applyLang();
  bindUI();
  if(!store.get("winds_onb",false)) openOv("ovOnboard");
  startLoop();
}
initGame();
/* == 19 end == */
